[workspace]
resolver = "2"
members = [
    "crates/lr-core",
    "crates/lr-bgp",
    "crates/lr-ospf",
    "crates/lr-babel",
    "crates/lr-rib",
    "crates/lr-policy",
    "crates/lr-router",
    "crates/lr-bfd",
    "crates/lr-bmp",
    "crates/lr-mrt",
    "crates/lr-damping",
    "crates/lr-osroute",
    "crates/lr-mpls",
    "crates/lr-srv6",
    "crates/lr-ldp",
    "crates/lr-ffi",
    "crates/lr-cli",
    "crates/lr-tests",
]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["TES286-org"]
repository = "https://github.com/TES286-org/librouting"
homepage = "https://github.com/TES286-org/librouting"
description = "Platform-independent BGP, OSPF and Babel routing protocol library"
keywords = ["bgp", "ospf", "babel", "routing", "network"]
categories = ["network-programming", "parser-implementations", "no-std"]

[workspace.dependencies]
lr-core = { path = "crates/lr-core", version = "1.0.0-rc.2" }
lr-bgp = { path = "crates/lr-bgp", version = "1.0.0-rc.2" }
lr-ospf = { path = "crates/lr-ospf", version = "1.0.0-rc.2" }
lr-babel = { path = "crates/lr-babel", version = "1.0.0-rc.2" }
lr-rib = { path = "crates/lr-rib", version = "1.0.0-rc.2" }
lr-policy = { path = "crates/lr-policy", version = "1.0.0-rc.2" }
lr-router = { path = "crates/lr-router", version = "1.0.0-rc.2" }
lr-bfd = { path = "crates/lr-bfd", version = "1.0.0-rc.2" }
lr-bmp = { path = "crates/lr-bmp", version = "1.0.0-rc.2" }
lr-mrt = { path = "crates/lr-mrt", version = "1.0.0-rc.2" }
lr-damping = { path = "crates/lr-damping", version = "1.0.0-rc.2" }
lr-osroute = { path = "crates/lr-osroute", version = "1.0.0-rc.2" }
lr-mpls = { path = "crates/lr-mpls", version = "1.0.0-rc.2" }
lr-srv6 = { path = "crates/lr-srv6", version = "1.0.0-rc.2" }
lr-ldp = { path = "crates/lr-ldp", version = "1.0.0-rc.2" }
lr-ffi = { path = "crates/lr-ffi", version = "1.0.0-rc.2" }

bytes = "1"
socket2 = "0.5"
thiserror = "1"
tracing = "0.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
hmac = "0.12"
sha1 = "0.10"
blake2 = "0.10"
sha2 = "0.10"
siphasher = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
