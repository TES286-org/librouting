[workspace]
resolver = "2"
members = [
    "crates/lr-core",
    "crates/lr-bgp",
    "crates/lr-ospf",
    "crates/lr-babel",
    "crates/lr-rib",
    "crates/lr-policy",
    "crates/lr-router",
    "crates/lr-bfd",
    "crates/lr-bmp",
    "crates/lr-mrt",
    "crates/lr-damping",
    "crates/lr-peer-health",
    "crates/lr-osroute",
    "crates/lr-mpls",
    "crates/lr-srv6",
    "crates/lr-ldp",
    "crates/lr-ffi",
    "crates/lr-cli",
    "crates/lr-tests",
]

[workspace.package]
version = "1.8.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["TES286-org"]
repository = "https://github.com/TES286-org/librouting"
# `homepage` removed: it was identical to `repository`, which
# `cargo::redundant_homepage` flags on every crate that inherits both.
# `keywords` and `categories` removed from the workspace level: no crate
# inherits them via `keywords.workspace = true` (each crate that carries
# them defines its own), so the workspace fields were unused metadata
# that `cargo::unused_workspace_package_fields` flagged on every build.
description = "Platform-independent BGP, OSPF and Babel routing protocol library"

[workspace.dependencies]
lr-core = { path = "crates/lr-core", version = "1.8.0" }
lr-bgp = { path = "crates/lr-bgp", version = "1.8.0" }
lr-ospf = { path = "crates/lr-ospf", version = "1.8.0" }
lr-babel = { path = "crates/lr-babel", version = "1.8.0" }
lr-rib = { path = "crates/lr-rib", version = "1.8.0" }
lr-policy = { path = "crates/lr-policy", version = "1.8.0" }
lr-router = { path = "crates/lr-router", version = "1.8.0" }
lr-bfd = { path = "crates/lr-bfd", version = "1.8.0" }
lr-bmp = { path = "crates/lr-bmp", version = "1.8.0" }
lr-mrt = { path = "crates/lr-mrt", version = "1.8.0" }
lr-damping = { path = "crates/lr-damping", version = "1.8.0" }
lr-peer-health = { path = "crates/lr-peer-health", version = "1.8.0" }
lr-osroute = { path = "crates/lr-osroute", version = "1.8.0" }
lr-mpls = { path = "crates/lr-mpls", version = "1.8.0" }
lr-srv6 = { path = "crates/lr-srv6", version = "1.8.0" }
lr-ldp = { path = "crates/lr-ldp", version = "1.8.0" }
# `lr-ffi` removed from `workspace.dependencies`: no crate in the
# workspace writes `lr-ffi.workspace = true` (the FFI crate is built as
# a standalone target that the Go/Python bindings link against by
# filesystem path, not as a Cargo dependency of another crate). The
# `lr-ffi` crate itself stays — it is a workspace member under
# `members`. The entry here was unused metadata that
# `cargo::unused_workspace_dependencies` flagged on every build.

socket2 = { version = "0.6", features = ["all"] }

# Event-loop substrate for the daemon's BGP session layer
# (`crates/lr-cli/src/bgp_reactor.rs`): one reactor thread drives every
# established BGP session with readiness events instead of one thread
# per socket polling on a read timeout. `mio` is the poll(2)/WSAPoll
# wrapper the ROADMAP's async-I/O item names — the smaller dependency
# the daemon already avoids `tokio` for (the API and metrics threads
# are hand-rolled for the same reason). OS-polling only, no async
# runtime, no task spawning.
mio = { version = "1", features = ["net", "os-ext"] }
thiserror = "2"
tracing = "0.1"
bitflags = "2"
hmac = "0.13"
sha1 = "0.11"
md5 = { version = "0.8", default-features = false }
blake2 = "0.11"
sha2 = "0.11"
siphasher = "1"

# Test / dev-only workspace deps (ROADMAP-v3 D6). Per-crate opt-in
# via `[dev-dependencies]` — these are *not* pulled into release
# builds and never reach downstream consumers.
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
