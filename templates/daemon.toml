# lr-daemon configuration (TOML subset).
#
# Equivalent CLI:
#   lr-daemon --local-as 64512 --peer-as 64513 --router-id 10.0.0.1 \
#             --peer 192.0.2.2:179 --local-address 192.0.2.1 \
#             --network 203.0.113.0/24 --hold-time 90
#
# Multi-peer deployments: add [[peer]] tables (bottom of this file).
# Every [bgp] global below doubles as the default each [[peer]] inherits
# unless it sets its own value.

[bgp]
local_as = 64512
peer_as = 64513
router_id = "10.0.0.1"

# Outbound: connect to the peer (legacy single-peer key; omit when
# listen_addr is used). Repeatable per-peer remotes use [[peer]] instead.
peer_addr = "192.0.2.2:179"

# Inbound: accept BGP connections. With only the legacy single peer the
# listener accepts any connection on session #1 (historical behaviour);
# once [[peer]] tables exist, inbound connections are matched to peers
# by source address and unmatched connections are rejected.
# listen_addr = "0.0.0.0:179"

# Source address for next-hop-self egress. Required when the daemon peers
# over an address not derivable from peer_addr/listen_addr.
local_address = "192.0.2.1"

# Hold time in seconds (default 90; 0 disables keepalives).
hold_time = 90

# Install best routes into the kernel FIB (root + Linux; the CLI flag
# is --install-kernel-routes).
# install_kernel = false

# RFC 8212 default eBGP route behavior for peers without an explicit
# import/export route-map:
#   "rfc8212"    (default) deny-in/deny-out — external peers without an
#                import route-map have their received routes discarded,
#                peers without an export route-map are announced nothing.
#   "accept-all" the legacy RFC 4271 default-accept the RFC permits as a
#                deviation (Appendix A "insecure-mode"). iBGP peers are
#                never affected — RFC 8212 scopes to EBGP sessions.
# ebgp_policy = "rfc8212"

# FRR `bgp enforce-first-as` (W2.2): when on, an eBGP UPDATE whose
# leftmost AS_PATH sequence segment's first AS is not the peer's AS
# is rejected before Adj-RIB-In. Off by default — matches FRR
# `no bgp enforce-first-as` and the RFC 4271 §6.3 "MAY reject" latitude.
# iBGP and confederation-internal sessions are exempt, mirroring FRR.
# CLI: --enforce-first-as / --no-enforce-first-as
# enforce_first_as = false

# FRR `bgp bestpath compare-routerid` (W2.2): when on (the default), the
# best-path tiebreaker is the lowest BGP IDENTIFIER (RFC 5004
# deterministic mode). When off, the oldest-received route wins
# (FRR's default). CLI: --bestpath-compare-routerid /
# --no-bestpath-compare-routerid
# bestpath_compare_routerid = true

# FRR `bgp default ipv4-unicast` (W2.1): when on (the default — matches
# FRR and BIRD's MP-BGP capability requirement), IPv4 unicast is
# implicitly active for every BGP peer even when its `mp_families`
# does not list it. When off, IPv4 unicast must be added explicitly to
# the peer's `mp_families` (FRR `no bgp default ipv4-unicast` with
# explicit `address-family ipv4 unicast` / `neighbor X activate`).
# Per-peer override: `[peer.X] default_ipv4_unicast = false`.
# CLI: --default-ipv4-unicast / --no-default-ipv4-unicast
# default_ipv4_unicast = true

# FRR `bgp allow-local-as [N]` / BIRD `allow local as` (W2.3): admit
# a route whose AS_PATH contains the local AS up to N times. `0` (the
# default) rejects any occurrence (RFC 4271 §9.1.2.15 AS_PATH loop
# check). `N > 0` admits up to N occurrences (FRR `allowas-in N`,
# default N=1). `any` admits any number (FRR `allowas-any`). iBGP
# sessions are exempt (FRR/BIRD scope the relaxation to eBGP).
# Per-peer override: `[peer.X] allow_local_as = N` (or `any`).
# CLI: --allow-local-as [N] / --allowas-any
# allow_local_as = 0

# RFC 4724 graceful restart: restart time advertised to the peer, in
# seconds (0 disables). Stale routes from the peer are retained for this
# window after a session loss.
graceful_restart_time = 120

# RFC 9494 long-lived graceful restart: stale time advertised per address
# family, in seconds (0 disables). Retention extends past the RFC 4724
# window; stale routes are marked LLGR_STALE and become least preferred.
# llgr_stale_time = 3600

# Optional local cap on the LLGR stale time received from the peer
# (seconds; 0 = honour the peer's value).
# llgr_max_stale_time = 7200

# RFC 2385 TCP MD5 session authentication (transport level). The same
# secret must be configured on the peer ("password" in BIRD / FRR).
# Mutually exclusive with tcp_ao_keys.
# md5_key = "alpha"

# RFC 5925 TCP-AO session authentication (Linux 6.7+). Keys are
# "id:secret"; the id is used as both SendID and RecvID, and the first
# key is Current/RNext. Optionally select the MAC algorithm
# ("hmac-sha1", the default, or "cmac-aes") and MAC length (default 12).
# tcp_ao_keys = ["1:alpha"]
# tcp_ao_algorithm = "hmac-sha1"
# tcp_ao_maclen = 12

# RFC 7911 Add-Path: advertise the Add-Path capability (send + receive)
# so the session can carry multiple paths per prefix. Effective only when
# the peer also offers it. add_path_max_paths caps how many paths per
# prefix the decision process keeps (default 6).
# add_path = true
# add_path_max_paths = 6

# RFC 4760 MP-BGP address families advertised in OPEN. Defaults to
# IPv4 unicast only. Set both to enable a dual-stack MP-BGP session
# (a single TCP transport carrying IPv4 + IPv6 NLRI).
# Recognised values:
#   "ipv4-unicast"            — AFI=1, SAFI=1 (default)
#   "ipv6-unicast"            — AFI=2, SAFI=1
#   "ipv4-labeled-unicast"    — AFI=1, SAFI=4 (RFC 8277 BGP-LU)
#   "ipv6-labeled-unicast"    — AFI=2, SAFI=4 (RFC 8277 BGP-LU)
# mp_families = ["ipv4-unicast", "ipv6-unicast", "ipv4-labeled-unicast"]

# RFC 5549 Extended Next-Hop: advertise the (1,1,2) tuple so IPv4 NLRI
# may be resolved over an IPv6 next-hop. Useful for IPv6-only transports
# that still need to carry IPv4 routes. Requires peer support.
# extended_next_hop = true

# Local IPv6 source address for next-hop-self egress over IPv6 NLRI or
# RFC 5549 ENH. When the transport is IPv6 this overrides local_address;
# otherwise it is used only when extended_next_hop is set.
# local_address_v6 = "2001:db8::1"

# Locally originated networks. Reloadable via SIGHUP / the runtime API
# `reload` command: added prefixes are originated, removed ones withdrawn.
networks = ["203.0.113.0/24"]

# RFC 8277 labelled networks — each entry is "<prefix> <labels>" where
# <labels> is a comma-separated list of 20-bit MPLS label values (top of
# stack first). Originated as IPv4 labelled-unicast (AFI=1, SAFI=4) for
# IPv4 prefixes and IPv6 labelled-unicast (AFI=2, SAFI=4) for IPv6
# prefixes. Requires the matching family in `mp_families` above so the
# peer accepts the labelled MP_REACH_NLRI.
# labeled_networks = [
#     "198.51.100.0/24 100",
#     "10.0.0.0/8 100,200,3",  # multi-label stack, implicit-null terminator
# ]

# --- Daemon hardening (top-level keys) ---

# Drop privileges to this user (name or numeric uid) after the listener is
# bound and session auth armed. Default group: the user's login group.
# Unix only; without it the daemon keeps its startup identity.
# user = "lr"

# Override the privilege-drop group (name or numeric gid).
# group = "lr"

# Runtime API on a Unix stream socket (0600) for operational visibility:
# status / sessions / routes / reload / shutdown / help (one command per
# line, e.g. `echo status | socat - UNIX-CONNECT:/run/lr-daemon.api`).
# SIGTERM/SIGINT shut the daemon down gracefully (sessions are closed with
# a NOTIFICATION); SIGHUP is equivalent to `reload`.
# api_socket = "/run/lr-daemon.api"

# ---------------------------------------------------------------------
# BFD fast-fail (RFC 5880/5881; the timing applies to every peer that
# enables bfd). A BFD Up->Down transition tears the BGP session down
# immediately instead of waiting out the hold timer. Requires a
# local_address (the BFD sockets bind it).
# bfd = true
# bfd_multihop = false     # RFC 5883 multihop sessions (UDP 4784, no TTL check)
# bfd_min_tx_ms = 100      # DesiredMinTxInterval (RFC 5880 6.8.1)
# bfd_min_rx_ms = 100      # RequiredMinRxInterval
# bfd_multiplier = 3       # packets lost before Down (~300ms at 100ms)

# ---------------------------------------------------------------------
# Multi-peer configuration.
#
# Each [[peer]] table configures one BGP session. Keys left unset inherit
# the [bgp] globals above. A peer is either outbound (`remote` — the
# daemon dials it, with its own reconnect thread and backoff) or inbound
# (`address` — the expected source IP of connections the listener matches
# to this peer). Configuring both on one peer waits for RFC 4271 §6.8
# collision detection (future work).
#
# Reusable defaults: [peer-template.<name>] tables hold any [[peer]]
# key; peers pull them in with extends = "<name>" and override
# per-peer. Templates may extend other templates (most specific key
# wins; cycles and unknown names are startup errors).
#
# Available keys: name, remote, address, peer_as, hold_time,
# graceful_restart_time, llgr_stale_time, llgr_max_stale_time,
# local_address, local_address_v6, md5_key, tcp_ao_keys,
# tcp_ao_algorithm, tcp_ao_maclen, add_path, add_path_max_paths,
# mp_families, extended_next_hop, gtsm, max_prefixes, max_prefix_action,
# max_prefix_threshold, bfd, bfd_multihop.
#
# Example (commented out):
#
# [[peer]]
# name = "transit-a"
# remote = "192.0.2.2:179"
# peer_as = 64513
# md5_key = "alpha"
#
# [peer-template.customer]
# peer_as = 64514
# hold_time = 30
# max_prefixes = 1000
# max_prefix_action = "teardown"
# import = "from-customer"
#
# [[peer]]
# name = "customer-b"
# address = "198.51.100.2"
# extends = "customer"
#
# [[peer]]
# name = "customer-c"
# address = "198.51.100.3"
# extends = "customer"
# max_prefixes = 500        # per-peer override
#
# Note: inbound peers must share one auth configuration (the listener
# socket is armed once); heterogeneous listener keys are future work.

# ---------------------------------------------------------------------
# Routing policy (W1.4): named lists + route-maps, attached per peer.
#
# Lists are first-match / implicit-deny, FRR-style. Route-map entries
# apply in ascending `entry` order (ties keep file order); `permit`
# sets the verdict of that entry, omit it to fall through to the next
# entry after applying the sets.
#
# Available tables and keys:
#
#   [[prefix-list]]    name, prefix, ge (default: prefix len),
#                      le (default: unbounded), permit (default: true)
#   [[as-path-list]]   name, pattern, permit (default: true)
#                      pattern tokens: ^ start, $ end, _ any separator;
#                      e.g. "_65000$" = learned from AS65000
#   [[community-list]] name, communities (["asn:value", "no-export",
#                      "llgr-stale", ...]), permit (default: true)
#   [[route-map]]      name, entry, match_prefix, match_as_path,
#                      match_community (AND), set_local_pref, set_med,
#                      set_metric, set_next_hop, prepend ("65001 65001"),
#                      add_community ("64512:100"), permit
#
# Peers attach policy with import = "<route-map>" / export = "<route-map>"
# (see [[peer]] keys above). Unknown references fail at startup —
# policy never silently passes traffic.
#
# Under the default ebgp_policy = "rfc8212" (see [bgp] above) an
# external peer without an import route-map discards every received
# route and one without an export route-map is announced nothing, so
# production eBGP peers always want explicit policy in both
# directions; a permit-all route-map restores the flow when intended:
#
#   [[route-map]]
#   name = "permit-all"
#   entry = 10
#   permit = true

[[prefix-list]]
name = "customer-space"
prefix = "203.0.113.0/24"

[[route-map]]
name = "to-customer"
entry = 10
match_prefix = "customer-space"
permit = true

[[route-map]]
name = "to-customer"
entry = 20      # everything else stays internal
permit = false

# [[peer]]
# name = "customer-b"
# address = "198.51.100.2"
# peer_as = 64514
# export = "to-customer"

# ---------------------------------------------------------------------------
# OSPF daemon mode (run with --protocol ospf; BGP tables above are ignored)
# ---------------------------------------------------------------------------
# CLI equivalent (single area, defaults):
#   lr-daemon --protocol ospf --router-id 10.0.0.1 \
#             --ospf-interface eth0 [--ospf-area 0]
#
# Raw OSPF sockets (IP protocol 89, multicast 224.0.0.5) need root or a
# user/network namespace: `unshare -Urn lr-daemon --protocol ospf ...`.
# The daemon sends Hellos per hello_interval, discovers neighbors
# dynamically, originates a Router-LSA per area (stub links from the
# interface addresses + p2p links per Full adjacency) and runs the dead
# timer per interface. See docs/STATUS.md (W1.5) for the current scope:
# OSPFv2, no DR election (segments behave p2p), simplified DBD exchange.

# [ospf]
# hello_interval = 10        # per-interface default (RFC 2328 default)
# dead_interval = 40         # per-interface default (4x hello)

# Non-backbone areas must be declared before interfaces reference them;
# the backbone (area 0) is implicit and always "normal".
# [[ospf.area]]
# id = 1                      # integer or dotted quad ("0.0.0.1")
# type = "stub"               # normal (default) | stub | nssa
# no_summary = true           # totally-stubby / totally-NSSA
# stub_metric = 10            # default-route metric injected into the area

# [[ospf.interface]]
# name = "eth0"               # kernel interface (required)
# area = 0                    # inherits --ospf-area (default 0)
# cost = 10                   # Router-LSA link metric
# hello_interval = 10         # inherits [ospf]
# dead_interval = 40          # inherits [ospf]
# priority = 1                # DR election priority (future)
