# Bird config for interop testing with librouting.

log "bird.log" all;
debug protocols all;

router id 10.0.0.99;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "lo";
}

protocol static static_test {
    ipv4;
    route 10.0.0.0/8 unreachable;
}

protocol bgp librouting {
    description "librouting interop";
    local 127.0.0.1 as 64513;
    neighbor 127.0.0.1 as 64512;
    hold time 90;
    keepalive time 30;

    ipv4 {
        import all;
        export all;
    };
}
