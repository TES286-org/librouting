# Corpus case: a BIRD filter exercising the OSPF advertising-router
# ID attribute the lr DSL now exposes (RFC 2328 §A.4 `Advertising
# Router` field / RFC 5340 §A.4 the same field on every v3 LSA). The
# translator renames BIRD's `ospf_router_id` to lr's `ospf.router_id`
# and the body round-trips through the daemon loader.
#
# The two arms mirror the canonical OSPF router-id idioms:
# 1. `defined(ospf_router_id) && ospf_router_id == 3221225985` —
#    only re-advertise routes whose originating LSA was sourced by
#    192.0.2.1 (0xc000_0201 = 3221225985). The `defined()` gate
#    distinguishes "no attribute" (a non-OSPF route, or an OSPF route
#    whose computation could not identify the originating LSA's
#    advertising router — the defensive fallback) from "attribute
#    present but zero" (a router carrying Router-ID 0.0.0.0 — RFC
#    2328 §3.1.b recommends non-zero but does not forbid it), so a
#    route without the attribute does not get a false match.
# 2. `ospf_router_id = 0` — accept a route whose originating LSA was
#    sourced by 0.0.0.0. Without `defined()` this arm also accepts
#    routes without the attribute (the `0` read mirrors BIRD's eattr
#    default for an unattached `ospf_router_id` reference).

filter import_ospf_router_id {
    if defined(ospf_router_id) && ospf_router_id = 3221225985 then accept;
    if ospf_router_id = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_ospf_router_id;
        export all;
    };
}
