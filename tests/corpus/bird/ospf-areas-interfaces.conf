# Corpus case: a BIRD `protocol ospf` block (RFC 2328 §C / RFC 5340
# §A.4) with a backbone area and a stub area, plus three interface
# definitions exercising the mapped parameters (cost, hello, dead,
# priority, type) and one unmapped parameter (`retransmit` → UNMAPPED
# note). The converter maps these onto `[[ospf.area]]` and
# `[[ospf.interface]]` tables.
router id 10.0.0.1;

protocol ospf v2 {
    area 0 {
        interface "eth0" {
            cost 10;
            hello 10;
            dead interval 40;
            priority 100;
            type broadcast;
        };
    };
    area 0.0.0.2 {
        stub yes;
        summary no;
        default cost 100;
        interface "eth1" {
            cost 20;
            type pointopoint;
            retransmit 5;
        };
    };
}
