# Corpus case: `import none` / `export none` channels. The converter
# maps each to a generated deny-all route-map (`translate-import-deny`
# / `translate-export-deny`) so the peer drops everything on that
# direction while the emitted `ebgp_policy = "accept-all"` keeps the
# dialect default the source config relied on.
router id 10.0.0.1;

protocol bgp upstream {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import none;
        export none;
    };
}
