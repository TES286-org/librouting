# Corpus case: a BIRD filter exercising the OTC attribute the lr DSL
# now exposes (RFC 9234 §3.1). The translator renames BIRD's
# `bgp_otc` to lr's `bgp.otc` and the body round-trips through the
# daemon loader.
#
# The two arms mirror the canonical RFC 9234 leak-detection idioms:
# 1. `defined(bgp_otc) && bgp_otc != 0` — RFC 9234 §5 egress rule 2
#    in filter form: a route that already carries OTC is
#    "customer-only" and must not transit to a provider or peer.
#    The `defined()` gate distinguishes "absent" from "set to zero"
#    so a peer that legitimately set OTC=0 (rare but legal) does not
#    trip the leak detector.
# 2. `bgp_otc = 0` — accept routes whose OTC is unset (the common
#    case for routes learned from a customer that did not tag them).

filter import_otc {
    if defined(bgp_otc) && bgp_otc != 0 then reject;
    if bgp_otc = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_otc;
        export all;
    };
}
