# Corpus case: a BIRD filter exercising the PMSI Tunnel attribute
# the lr DSL now exposes (RFC 6514 §5). The translator renames
# BIRD's `bgp_pmsi_tunnel` to lr's `bgp.pmsi_tunnel` and the body
# round-trips through the daemon loader.
#
# The two arms mirror the canonical RFC 6514 presence-probe idioms:
# 1. `defined(bgp_pmsi_tunnel)` — drop routes that carry a PMSI
#    Tunnel binding (an MVPN A-D route does not belong on a
#    non-MVPN edge). The `defined()` gate distinguishes "absent"
#    from "present but malformed" so a partial-bit UPDATE from a
#    non-MVPN peer does not get a false read.
# 2. `!defined(bgp_pmsi_tunnel)` — accept everything else (the
#    common case for routes from a peer that does not run MVPN).

filter import_pmsi {
    if defined(bgp_pmsi_tunnel) then reject;
    if !defined(bgp_pmsi_tunnel) then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_pmsi;
        export all;
    };
}
