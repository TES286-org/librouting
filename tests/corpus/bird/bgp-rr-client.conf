# Corpus case: a BIRD 2 route-reflector configuration exercising the
# `rr client;` directive (RFC 4456 §3) and the `route reflector
# cluster_id A.B.C.D;` directive (RFC 4456 §10). Both map onto lr's
# TOML keys: `rr client;` → per-peer `route_reflector_client = true`,
# and `route reflector cluster_id A.B.C.D;` → router-wide
# `[bgp] route_reflector_cluster_id = "A.B.C.D"`.
#
# The peer carries the RR-client flag; the cluster id is router-wide
# (lr keys it off `[bgp]` rather than per-peer, mirroring FRR's
# `bgp cluster-id`). A non-client peer (`rr_non_client`) appears as
# a regression guard so a future refactor that accidentally flips
# every peer's `route_reflector_client` to `true` fails this corpus
# case.

router id 10.0.0.1;

protocol bgp rr_client_a {
    local as 64512;
    neighbor 192.0.2.2 as 64512;
    rr client;
    route reflector cluster_id 10.0.0.254;
    ipv4 {
        import all;
        export all;
    };
}

protocol bgp rr_non_client {
    local as 64512;
    neighbor 192.0.2.3 as 64512;
    ipv4 {
        import all;
        export all;
    };
}
