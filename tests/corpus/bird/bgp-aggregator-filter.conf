# Corpus case: a BIRD filter exercising the AGGREGATOR attribute the
# lr DSL now exposes (RFC 4271 §5.1.7). The translator renames BIRD's
# `bgp_aggregator` to lr's `bgp.aggregator.asn` and the body
# round-trips through the daemon loader.
#
# BIRD spells AGGREGATOR as a structured `egroup` value; lr's DSL
# decomposes the pair into `bgp.aggregator.asn` and
# `bgp.aggregator.speaker`. The canonical BIRD idiom
# `defined(bgp_aggregator)` ("was this route aggregated?") maps to
# `defined(bgp.aggregator.asn)` — faithful because the AS and speaker
# are present together or absent together.
#
# The two arms mirror the canonical aggregation-aware idioms:
# 1. `defined(bgp_aggregator)` — accept only routes that carry an
#    aggregator (i.e. routes that were summarised upstream). The
#    `defined()` gate distinguishes "absent" from "set to zero" so a
#    peer that legitimately set AS 0 does not get a false read.
# 2. `bgp_aggregator = 0` — accept routes whose aggregator AS is zero
#    (the common fall-through for non-aggregated routes).

filter import_aggregator {
    if defined(bgp_aggregator) then accept;
    if bgp_aggregator = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_aggregator;
        export all;
    };
}
