# Corpus case: a BIRD ROA table with `roa` entries and a filter that
# calls `roa_check`. The ROA rows carry over as `[[roa]]` tables and
# the `roa.state` comparison idiom maps onto the filter DSL.
roa table my_roas {
    roa 203.0.113.0/24 max 24 as 64513;
    roa 198.51.100.0/24 max 26 as 64514;
}

filter import_roa {
    if roa_check(my_roas) = ROA_INVALID then reject;
    if roa_check(my_roas) = ROA_UNKNOWN then accept;
    accept;
}

protocol bgp upstream {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_roa;
        export all;
    };
}
