# Corpus case: a BIRD filter exercising the Babel sequence
# number attribute the lr DSL now exposes (RFC 8966 §3.2 + §4.6.9
# — the 16-bit unsigned sequence number carried in every Update
# TLV, the source's sequence number the feasibility machinery
# ranks against per RFC 8966 §3.4.2). The translator renames BIRD's
# `babel_seqno` to lr's `babel.seqno` and the body round-trips
# through the daemon loader.
#
# The two arms mirror the canonical Babel seqno idioms:
# 1. `defined(babel_seqno) && babel_seqno > 100` — reject a
#    stale Babel route whose source's seqno has rolled past
#    100 (the feasibility window). The `defined()` gate
#    distinguishes "non-Babel route" from "Babel route with
#    seqno 0" (RFC 8966 §3.1 treats 0 as a valid sequence
#    number — the wrapping arithmetic `(seqno as i16)
#    .wrapping_sub(...)` ranks against it the same as any
#    other value), so a non-Babel route does not get a false
#    match.
# 2. `babel_seqno = 0` — accept a Babel route whose source
#    claimed seqno 0 (an unusual but well-formed value).
#    Without `defined()` this arm also accepts routes without
#    the attribute (the `0` read mirrors BIRD's eattr default
#    for an unattached `babel_seqno` reference).

filter import_babel_high_seqno {
    if defined(babel_seqno) && babel_seqno > 100 then reject;
    if babel_seqno = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_babel_high_seqno;
        export all;
    };
}
