# Corpus case: a BIRD `protocol static` block whose `route` entries
# become the daemon's `networks` list (locally originated prefixes).
# Two peers import/export them. RFC 4271 §9.3 is the first-hand
# reference for locally-originated NLRI.
router id 10.0.0.1;

protocol static seed {
    ipv4;
    route 203.0.113.0/24 blackhole;
    route 198.51.100.0/25 blackhole;
}

protocol bgp uplink {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import all;
        export all;
    };
}
