# Corpus case: a BIRD filter exercising the route-reflector loop-
# detection attributes the lr DSL now exposes (RFC 4456 §8 +
# RFC 4271 §5.1.6). The translator renames BIRD's `bgp_atomic_aggregate`,
# `bgp_originator_id` and `bgp_cluster_list` to lr's dotted spellings
# and the body round-trips through the daemon loader.
#
# The three arms mirror the canonical RR loop-detection idioms:
# 1. `bgp_cluster_list ~ [ local_cluster ]` — RFC 4456 §8: "If the
#    local CLUSTER_ID is found in the CLUSTER_LIST, the advertisement
#    received SHOULD be ignored."
# 2. `bgp_originator_id = local_bgp_id` — RFC 4456 §8: "A router that
#    recognizes the ORIGINATOR_ID attribute SHOULD ignore a route
#    received with its BGP Identifier as the ORIGINATOR_ID."
# 3. `bgp_atomic_aggregate` — RFC 4271 §5.1.6: a less-specific route
#    was aggregated without preserving the more-specific attributes,
#    so some operators drop these on import.

filter import_rr {
    if defined(bgp_cluster_list) && 10.0.0.1 ~ bgp_cluster_list then reject;
    if bgp_originator_id = 10.0.0.1 then reject;
    if bgp_atomic_aggregate then reject;
    accept;
}

protocol bgp rr_client {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_rr;
        export all;
    };
}
