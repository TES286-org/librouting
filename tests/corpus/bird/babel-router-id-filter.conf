# Corpus case: a BIRD filter exercising the Babel Router-ID
# attribute the lr DSL now exposes (RFC 8966 §3.2 + §4.6.8 — the
# 64-bit EUI-64-style Router-ID carried in every Update TLV's
# Router-Id TLV, identifying the router that originated the
# route's source). The translator renames BIRD's
# `babel_router_id` to lr's `babel.router_id` and the body
# round-trips through the daemon loader.
#
# BIRD stores the value as an opaque 8-byte bytestring under
# `EAF_TYPE_OPAQUE`; lr's DSL exposes it as a 64-bit `Int` for
# the canonical `defined(babel.router_id)` idiom and for direct
# equality against the route's i64-form literal. The
# `defined()` predicate is the faithful surface BIRD operators
# use most — the canonical idiom is `if defined(babel_router_id)
# then accept;` ("only re-advertise routes whose source claimed
# a Babel Router-ID — i.e. only Babel routes").
#
# The two arms mirror the canonical Babel router-id idioms:
# 1. `defined(babel_router_id)` — accept any route carrying
#    the Babel Router-ID attribute (i.e. any Babel route the
#    router's Babel runtime published). The `defined()` gate
#    distinguishes "no attribute" (a non-Babel route) from
#    "attribute present but zero" (a Babel route whose source
#    claims Router-ID 0 — RFC 8966 §3.1 does not forbid it; the
#    EUI-64 form discourages it but the protocol accepts any
#    64-bit value), so a non-Babel route does not get a false
#    match.
# 2. `defined(babel_router_id) && babel_router_id = 0` —
#    accept a Babel route whose source claimed Router-ID 0
#    (an unusual but well-formed value). The `defined()` gate
#    keeps "Babel route with Router-ID 0" defined so the
#    canonical idiom does not drop such a route.

filter import_babel_known_router_id {
    if defined(babel_router_id) then accept;
    if defined(babel_router_id) && babel_router_id = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_babel_known_router_id;
        export all;
    };
}
