# Corpus case: a BIRD filter exercising the OSPF external route
# tag attribute the lr DSL now exposes (RFC 2328 §A.4.5 bullet h /
# RFC 3101 §2.3 / RFC 5340 §A.4.7 T bit / RFC 8362 §3.6
# External-Prefix sub-TLV 3). The translator renames BIRD's
# `ospf_tag` to lr's `ospf.tag` and the body round-trips through
# the daemon loader.
#
# The two arms mirror the canonical OSPF external-route-tag
# idioms:
# 1. `defined(ospf_tag) && ospf_tag == 3735928559` — accept a
#    redistribution-pipe route tagged with 0xdead_beef on the
#    upstream side. The `defined()` gate distinguishes "no tag"
#    (an intra-area / inter-area OSPF route, or a v3 external
#    without the T bit set) from "tag of zero" (a v2 external with
#    the default zero tag — well-formed per RFC 2328 §A.4.5 — or
#    a v3 external with the T bit set and value 0), so a route
#    without a tag does not get a false match.
# 2. `ospf_tag = 0` — accept a v2 external with the default zero
#    tag. Without `defined()` this arm also accepts routes
#    without a tag (the `0` read mirrors BIRD's eattr default
#    for an unattached `ospf_tag` reference).

filter import_ospf_tagged {
    if defined(ospf_tag) && ospf_tag = 3735928559 then accept;
    if ospf_tag = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_ospf_tagged;
        export all;
    };
}
