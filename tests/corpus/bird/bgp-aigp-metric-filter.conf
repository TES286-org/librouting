# Corpus case: a BIRD filter exercising the AIGP attribute the lr DSL
# now exposes (RFC 7311). The translator renames BIRD's `bgp_aigp` to
# lr's `bgp.aigp` and the body round-trips through the daemon loader.
#
# The two arms mirror the canonical RFC 7311 metric-comparison idioms:
# 1. `defined(bgp_aigp) && bgp_aigp < 100` — prefer lower-metric paths
#    within the AIGP administrative domain. The `defined()` gate
#    distinguishes "absent" from "set to zero" so a peer that
#    legitimately set AIGP=0 does not get a false read.
# 2. `bgp_aigp = 0` — accept routes whose AIGP is unset (the common
#    case for routes from a peer that does not run AIGP).

filter import_aigp {
    if defined(bgp_aigp) && bgp_aigp < 100 then accept;
    if bgp_aigp = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_aigp;
        export all;
    };
}
