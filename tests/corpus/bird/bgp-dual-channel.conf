# Corpus case: a dual-stack BGP peer with explicit ipv4 and ipv6
# channels. The ipv6-only channel on the second peer disables the
# daemon's implicit ipv4-unicast (`default_ipv4_unicast = false`) and
# adds `ipv6-unicast` to `mp_families`. Mirrors the BIRD dual-channel
# idiom from the BIRD 2 manual §6.2.
router id 10.0.0.1;

protocol bgp v4peer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import all;
        export all;
    };
}

protocol bgp v6peer {
    local as 64512;
    neighbor 2001:db8::2 as 64514;
    ipv6 {
        import all;
        export all;
    };
}
