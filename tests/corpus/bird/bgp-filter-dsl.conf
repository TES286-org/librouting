# Corpus case: a named BIRD filter translated into the lr filter DSL
# (D14.1) and attached to a peer via `import filter`. The filter uses
# the verified operator set the translator maps faithfully — a
# prefix-set literal (`net ~ [ ... ]`), a BGP attribute assignment
# (`bgp_local_pref := N`) and `accept`/`reject` verdicts.
filter import_upstream {
    if net ~ [ 10.0.0.0/8{8,32}, 192.0.2.0/24 ] then accept;
    bgp_local_pref := 200;
    accept;
}

protocol bgp upstream {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_upstream;
        export all;
    };
}
