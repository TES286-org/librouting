# Corpus case: a BIRD filter exercising the Babel primary metric
# attribute the lr DSL now exposes (RFC 8966 §3.2 + §3.4.3 — the
# value the Update TLV advertised, folded into
# `route.preference.metric` by the Babel route computation after
# applying the receiver-side link cost — the field the decision
# process ranks against, lowest-metric feasible route wins per
# RFC 8966 §3.5.1). The translator renames BIRD's `babel_metric`
# to lr's `babel.metric` and the body round-trips through the
# daemon loader.
#
# The two arms mirror the canonical Babel metric idioms:
# 1. `defined(babel_metric) && babel_metric > 100` — reject
#    high-metric Babel routes that would dominate the FIB.
#    The `defined()` gate distinguishes "non-Babel route" from
#    "Babel route with metric 0", so a non-Babel route does not
#    get a false match (the metric the route carries in
#    `preference.metric` is the OSPF / BGP / static cost on
#    non-Babel routes, not the Babel metric).
# 2. `babel_metric = 0` — accept a Babel route with metric 0
#    (a route the source advertised with cost 0). Without
#    `defined()` this arm also accepts routes without the
#    attribute (the `0` read mirrors BIRD's eattr default for
#    an unattached `babel_metric` reference).

filter import_babel_high_metric {
    if defined(babel_metric) && babel_metric > 100 then reject;
    if babel_metric = 0 then accept;
    reject;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_babel_high_metric;
        export all;
    };
}
