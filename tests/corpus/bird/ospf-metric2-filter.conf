# Corpus case: a BIRD filter exercising the OSPF type-2 external
# metric attribute the lr DSL now exposes (RFC 2328 §16.4 /
# RFC 5340 §4.8.5). The translator renames BIRD's `ospf_metric2`
# to lr's `ospf.metric2` and the body round-trips through the
# daemon loader.
#
# The two arms mirror the canonical OSPF type-2 external
# metric-comparison idioms:
# 1. `defined(ospf_metric2) && ospf_metric2 > 100` — reject
#    high-cost type-2 external OSPF routes a re-distribution pipe
#    picks up. The `defined()` gate distinguishes "not a type-2
#    external" from "type-2 external with metric 0" so an OSPF
#    intra-area or type-1 external route that does not carry the
#    `LrOspfMetric2` attribute does not get a false read.
# 2. `ospf_metric2 = 0` — accept metric-0 type-2 external routes
#    (an E-bit-set type-5 LSA whose 24-bit external metric happens
#    to be zero — unusual but well-formed per RFC 2328 §2.3).
#    Without `defined()` this arm also accepts non-type-2-external
#    routes (the `0` read mirrors BIRD's eattr default for an
#    unattached `ospf_metric2` reference).

filter import_ospf_type2 {
    if defined(ospf_metric2) && ospf_metric2 > 100 then reject;
    if ospf_metric2 = 0 then accept;
    accept;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_ospf_type2;
        export all;
    };
}
