# Corpus case: a BIRD `protocol babel` block (RFC 8966 §A.2) with two
# interface definitions carrying the common Babel parameters — rxcost,
# hello interval, type, wired/wireless. The converter maps these onto
# `[[babel.interface]]` tables and emits the "set protocol = babel"
# note (lr runs one protocol per daemon instance).
router id 10.0.0.1;

protocol babel lan {
    interface "eth0" {
        rxcost 96;
        hello interval 4 s;
        type wired;
    };
    interface "wlan0" {
        rxcost 256;
        hello interval 2 s;
        type wireless;
    };
}
