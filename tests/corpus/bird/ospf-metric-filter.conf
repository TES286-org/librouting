# Corpus case: a BIRD filter exercising the OSPF metric attribute
# the lr DSL now exposes (RFC 2328 §16 / RFC 5340 §4.1). The
# translator renames BIRD's `ospf_metric1` to lr's `ospf.metric1`
# and the body round-trips through the daemon loader.
#
# The two arms mirror the canonical OSPF metric-comparison idioms:
# 1. `defined(ospf_metric1) && ospf_metric1 > 100` — reject
#    high-cost OSPF routes a re-distribution pipe picks up. The
#    `defined()` gate distinguishes "non-OSPF route" from "OSPF
#    route with metric 0" so a BGP route that happens to share
#    the `preference.metric` slot does not get a false read.
# 2. `ospf_metric1 = 0` — accept cost-0 OSPF routes (a loopback
#    or other directly-attached network OSPF originates with
#    cost 0). Without `defined()` this arm also accepts non-OSPF
#    routes (the `0` read mirrors BIRD's eattr default for an
#    unattached `ospf_metric1` reference).

filter import_ospf {
    if defined(ospf_metric1) && ospf_metric1 > 100 then reject;
    if ospf_metric1 = 0 then accept;
    accept;
}

protocol bgp customer {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    ipv4 {
        import filter import_ospf;
        export all;
    };
}
