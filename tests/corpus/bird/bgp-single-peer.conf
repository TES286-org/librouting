# Corpus case: a single BGP peer with the common BIRD 2 shape —
# router-id, local AS, one neighbour, MD5 password, hold time, an
# ipv4 channel with import/export all, and `multihop` (which has no
# lr equivalent and surfaces as an UNMAPPED note). Exercises the core
# BGP peer mapping in `translate_bird`.
router id 10.0.0.1;

protocol bgp uplink {
    local as 64512;
    neighbor 192.0.2.2 as 64513;
    local address 10.99.1.1;
    password "s3cret";
    hold time 90;
    multihop 2;
    ipv4 {
        import all;
        export all;
    };
}
