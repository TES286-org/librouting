! Corpus case: FRR policy — a prefix-list, a route-map with match
! (prefix) and set (local-pref, next-hop, as-path prepend,
! community) clauses, plus a community-list and an as-path
! access-list. The neighbor wires the route-map to import and a
! prefix-list to export. Mirrors the FRR route-map idiom from the
! FRRouting user guide §8.
frr version 10
frr defaults traditional
!
ip prefix-list CUSTOMERS seq 5 permit 203.0.113.0/24
ip prefix-list CUSTOMERS seq 10 permit 198.51.100.0/24
!
bgp as-path access-list AS100 permit ^100_
bgp community-list standard WELLKNOWN permit 64512:100
!
route-map rm-in permit 10
 match ip address prefix-list CUSTOMERS
 set local-preference 200
 set ip next-hop 192.0.2.1
!
route-map rm-in permit 20
 match as-path AS100
 set community 64512:100 additive
!
route-map rm-out deny 10
 match ip address prefix-list CUSTOMERS
!
router bgp 64512
 bgp router-id 10.0.0.1
 neighbor 192.0.2.2 remote-as 64513
 neighbor 192.0.2.2 route-map rm-in in
 neighbor 192.0.2.2 route-map rm-out out
 neighbor 192.0.2.2 route-map rm-in in
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
 exit-address-family
 !
!
