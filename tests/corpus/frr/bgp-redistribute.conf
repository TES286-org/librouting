! Corpus case: FRR `redistribute <proto>` (inside `router bgp` +
! `address-family ipv4 unicast`). `redistribute ospf metric 100`
! maps onto a `[[redistribute]]` row with `source = "ospf"`,
! `target = "bgp"`, `metric = 100`. The pipe needs the ospf engine
! running, so the converter emits `protocols = ["bgp", "ospf"]` at
! the top — otherwise `finalize` would reject the pipe with "the
! daemon does not run the ospf engine". `redistribute connected`
! carries an UNMAPPED note: lr models kernel/static routes via
! `networks`, not via a redistribute pipe.
frr version 10
frr defaults traditional
!
router bgp 64512
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 64513
 !
 address-family ipv4 unicast
  redistribute ospf metric 100
  redistribute connected
 exit-address-family
 !
!
