! Corpus case: FRR `router ospfv3` block where the area policy and
! interface-to-area mapping use the `ospfv3 ` prefix throughout. The
! v3 spelling of `ospfv3 area N stub|nssa|default-cost M` and
! `ospfv3 network PREFIX area N` mirrors the bare v2 forms; the
! converter routes both through the same handlers and notes the
! `ospfv3 network … area …` gap (lr keys interfaces by name, not
! prefix — same constraint as v2).
frr version 10
frr defaults traditional
!
router ospfv3
 ospfv3 router-id 10.0.0.5
 ospfv3 area 2 stub
 ospfv3 area 2 default-cost 50
 ospfv3 network 2001:db8::/32 area 2
 exit
!
interface eth0
 ospfv3 cost 7
 ospfv3 area 2
!
