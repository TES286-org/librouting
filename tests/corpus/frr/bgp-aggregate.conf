! Corpus case: FRR `aggregate-address` (RFC 4271 §9.2.2.2) inside
! `router bgp` + `address-family ipv4 unicast`. The bare prefix form
! maps 1:1 onto a `[[aggregate]]` row; the `summary-only` qualifier
! carries an UNMAPPED note (lr's `[[aggregate]]` models only the
! prefix today — the specifics are not suppressed). Mirrors the FRR
! `aggregate-address` user-guide example.
frr version 10
frr defaults traditional
!
router bgp 64512
 bgp router-id 10.0.0.1
 neighbor 192.0.2.2 remote-as 64513
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  aggregate-address 203.0.113.0/24 summary-only
 exit-address-family
 !
!
