! Corpus case: FRR `router ospf` block (RFC 2328 §C) with a router-id,
! two areas (backbone + a stub no-summary area with default-cost), and
! `interface IFNAME` blocks carrying `ip ospf` directives (cost, hello,
! dead-interval, priority, authentication). The converter maps these
! onto `[[ospf.area]]` and `[[ospf.interface]]` tables. The
! `network PREFIX area N` form (noted as UNMAPPED) and an `area N
! range` directive (UNMAPPED) are included to lock in the visible-note
! contract.
frr version 10
frr defaults traditional
!
router ospf
 ospf router-id 10.0.0.1
 area 0.0.0.2 stub no-summary
 area 0.0.0.2 default-cost 100
 area 0.0.0.2 range 10.2.0.0/16
 network 10.0.0.0/24 area 0
 exit
!
interface eth0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf priority 100
 ip ospf authentication
 ip ospf authentication-key sec
!
interface eth1
 ip ospf cost 20
 ip ospf network point-to-point
!
