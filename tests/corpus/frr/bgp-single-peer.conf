! Corpus case: a single FRR bgpd peer — router bgp, bgp router-id,
! one neighbor with remote-as, a network statement, and the
! `no bgp ebgp-requires-policy` / `no bgp network import-check` pair
! common in FRR 10 traditional-defaults configs. The converter keeps
! FRR's `enforce-first-as = true` dialect default.
frr version 10
frr defaults traditional
!
router bgp 64512
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.0.2.2 remote-as 64513
 neighbor 192.0.2.2 update-source 10.99.1.1
 neighbor 192.0.2.2 password s3cret
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
 exit-address-family
 !
!
