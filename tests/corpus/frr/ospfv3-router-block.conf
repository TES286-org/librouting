! Corpus case: FRR `router ospfv3` block. The converter recognises the
! OSPFv3 form and emits a version note (the per-interface `ospfv3 …`
! directives under it are a follow-up rather than silently dropped).
! Mirrors the FRR OSPFv3 idiom (RFC 5340).
frr version 10
frr defaults traditional
!
router ospfv3
 ospfv3 router-id 10.0.0.1
 exit
!
interface eth0
 ospfv3 cost 10
!
