! Corpus case: FRR `router ospfv3` block (RFC 5340 §A.4). The
! converter recognises the OSPFv3 form, emits the version note so the
! operator sets `ospf_version = "v3"`, and maps the `ospfv3 router-id`
! router-level directive plus the per-interface `ospfv3 …` directives
! (`cost`, `hello-interval`, `dead-interval`, `priority`, `network`,
! `area`, `instance-id`) onto the same `[[ospf.interface]]` schema the
! v2 path uses. The `ospfv3 instance-id N` directive has no lr
! equivalent and is noted on the interface row.
frr version 10
frr defaults traditional
!
router ospfv3
 ospfv3 router-id 10.0.0.1
 area 1 stub no-summary
 area 1 default-cost 100
 exit
!
interface eth0
 ospfv3 cost 10
 ospfv3 hello-interval 10
 ospfv3 dead-interval 40
 ospfv3 priority 100
 ospfv3 network broadcast
 ospfv3 area 1
 ospfv3 instance-id 1
!
interface eth1
 ospfv3 cost 20
 ospfv3 network point-to-point
 ospfv3 area 1
!
