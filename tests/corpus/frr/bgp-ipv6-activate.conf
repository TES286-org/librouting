! Corpus case: FRR IPv6 activation. `address-family ipv6 unicast` +
! `neighbor … activate` adds `ipv6-unicast` to the peer's
! `mp_families`, and the `network …` under the IPv6 AFI is an
! IPv6 origination. Mirrors the FRR MP-BGP idiom (RFC 4760).
frr version 10
frr defaults traditional
!
router bgp 64512
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 2001:db8::2 remote-as 64514
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8::2 activate
  network 2001:db8:1::/48
 exit-address-family
 !
!
