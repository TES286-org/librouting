# Corpus case: an FRR bgpd route-reflector configuration exercising
# `bgp cluster-id A.B.C.D` (RFC 4456 §10) and `neighbor ADDR
# route-reflector-client` inside `address-family ipv4 unicast`
# (RFC 4456 §3). The cluster id maps onto the router-wide
# `[bgp] route_reflector_cluster_id`; the per-peer directive maps
# onto `[[peer]] route_reflector_client = true`.
#
# A non-client peer (`192.0.2.3`) appears as a regression guard so
# a future refactor that accidentally flips every peer's
# `route_reflector_client` to `true` fails this corpus case.

router bgp 64512
 bgp router-id 10.0.0.1
 bgp cluster-id 10.0.0.254
 neighbor 192.0.2.2 remote-as 64512
 neighbor 192.0.2.3 remote-as 64512
!
 address-family ipv4 unicast
  neighbor 192.0.2.2 route-reflector-client
 exit-address-family
!
