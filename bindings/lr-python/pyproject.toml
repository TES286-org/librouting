[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "librouting"
# Single source: librouting.__version__. Keeping a second literal here is
# how the two drifted apart before. bindings/lr-python/tests checks the
# value against the workspace version in Cargo.toml.
dynamic = ["version"]
description = "Python bindings for librouting (BGP, OSPF, Babel) via CFFI"
requires-python = ">=3.8"
dependencies = ["cffi>=1.16"]

[tool.setuptools.dynamic]
version = { attr = "librouting.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
