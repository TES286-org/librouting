[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "librouting"
version = "1.0.0-rc.2"
description = "Python bindings for librouting (BGP, OSPF, Babel) via CFFI"
requires-python = ">=3.8"
dependencies = ["cffi>=1.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
