[package]
name = "lr-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C ABI bindings to librouting (cbindgen-generated header)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "lr_ffi"

[features]
default = ["router", "bgp", "ospf", "babel"]
router = []
bgp = []
ospf = []
babel = []

[dependencies]
lr-core = { workspace = true }
lr-bgp = { workspace = true }
lr-ospf = { workspace = true }
lr-babel = { workspace = true }
lr-rib = { workspace = true }
lr-policy = { workspace = true }
lr-router = { workspace = true }

[build-dependencies]
cbindgen = "0.27"
