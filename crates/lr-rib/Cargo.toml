[package]
name = "lr-rib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Routing information base: Adj-RIB-In/Out, Loc-RIB, selection, merging"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[dependencies]
lr-core = { workspace = true }
tracing.workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "rib_select"
harness = false

[[bench]]
name = "rib_session_teardown"
harness = false
