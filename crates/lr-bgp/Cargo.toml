[package]
name = "lr-bgp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "BGP-4 protocol codec, peer FSM, path attributes and extensions"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["asn4", "mp_bgp", "addpath", "graceful_restart", "enhanced_rr", "extended_communities", "labeled_unicast"]
asn4 = []
mp_bgp = []
addpath = []
graceful_restart = []
enhanced_rr = []
extended_communities = []
long_lived = []
labeled_unicast = ["dep:lr-mpls"]
# W6.3 exchange-plane prototype (docs/research/EXCHANGE-PLANE.md) — off
# by default; the wire format uses experimental code points until an
# RFC 7120 early allocation settles them.
exchange-plane = ["dep:hmac", "dep:sha2"]

[dependencies]
lr-core = { workspace = true }
lr-mpls = { workspace = true, optional = true }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

# Standalone benchmarks — `cargo bench -p lr-bgp` runs all targets
# below. Each bench pins one codec hot path so the bench harness
# can spot a >10% regression against the baseline committed in
# `benches/baseline.txt` (to be added once the first nightly run
# lands a number).
[[bench]]
name = "bgp_decode"
harness = false

[[bench]]
name = "roa_validate"
harness = false
