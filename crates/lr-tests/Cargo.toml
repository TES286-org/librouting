[package]
name = "lr-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-crate integration tests for librouting"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

# lr-tests is a test-only crate: `src/lib.rs` is entirely behind
# `#[cfg(test)]`, and the `tests/*.rs` integration files are the
# primary surface. Every dependency is therefore a dev-dependency —
# `cargo build --workspace` (which does not compile test targets)
# would otherwise flag each one as unused. `lr-rib` was previously
# declared but never imported by any module; removed.
[dev-dependencies]
lr-core = { workspace = true }
lr-bgp = { workspace = true }
lr-ospf = { workspace = true }
lr-babel = { workspace = true }
lr-policy = { workspace = true, features = ["peer-health"] }
lr-router = { workspace = true }
lr-osroute = { workspace = true }
lr-bmp = { workspace = true }
lr-mpls = { workspace = true }
# Smoke-tested from `tests/smoke_crates.rs`. The daemon consumes each
# transitively through `lr-router` / `lr-cli`; the integration suite
# pulls them in directly so the smoke tests can reach the public API
# without going through the daemon's feature-gated paths.
lr-mrt = { workspace = true }
lr-damping = { workspace = true }
lr-peer-health = { workspace = true }
lr-srv6 = { workspace = true }
