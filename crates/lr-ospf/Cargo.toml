[package]
name = "lr-ospf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OSPFv2 and OSPFv3 codec, LSA, neighbor/interface FSM, SPF"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["v2", "v3", "nssa", "te", "hmac_sha", "graceful_restart"]
v2 = []
v3 = []
nssa = []
te = []
hmac_sha = []
graceful_restart = []

[dependencies]
lr-core = { workspace = true }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
