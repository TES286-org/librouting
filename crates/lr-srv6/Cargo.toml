[package]
name = "lr-srv6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SRv6 data-plane primitives — SID, locator and Segment Routing Header codec (RFC 8754 / RFC 8402 / RFC 8986) for librouting"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
lr-core = { workspace = true }
