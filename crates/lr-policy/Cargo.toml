[package]
name = "lr-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Routing policy: route maps, prefix lists, AS-path filters, community lists"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[dependencies]
lr-core = { workspace = true }
lr-bgp = { workspace = true, optional = true }
lr-damping = { workspace = true, optional = true }
tracing.workspace = true

[features]
default = ["std", "bgp"]
std = []
# Typed BGP path-attribute evaluation (community / AS-path matching,
# MED / prepend / add-community set actions). Requires std because
# lr-bgp is a std crate.
bgp = ["std", "dep:lr-bgp"]
# RFC 2439 route flap damping import hook. Pulls in the `lr-damping`
# crate and exposes `DampingImportHook`. Requires std because
# `lr-damping` is a std crate.
damping = ["std", "dep:lr-damping"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
lr-rib = { workspace = true }

[[bench]]
name = "filter_eval"
harness = false

# #19 P0 — daemon-level import-pipeline bench. Measures the per-route
# cost of the import path the daemon actually runs (DSL eval → Adj-RIB-In
# install → Loc-RIB install + best-path select), not just the DSL in
# isolation. Lives in `lr-policy` (not `lr-rib`) because the DSL eval is
# the dominant component and the bench drives the pipeline from the
# filter side; the bench pulls `lr-rib` as a dev-dependency (no cycle —
# `lr-rib` does not depend on `lr-policy`).
[[bench]]
name = "import_pipeline"
harness = false
