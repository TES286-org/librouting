[package]
name = "lr-bmp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "BGP Monitoring Protocol (RFC 7854) — BMP message codec and collector sink"

keywords = ["bmp", "bgp", "monitoring", "rfc7854"]
categories = ["network-programming", "parser-implementations"]

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["std"]
std = ["lr-core/std"]

[dependencies]
lr-core = { workspace = true }
lr-bgp = { workspace = true }
