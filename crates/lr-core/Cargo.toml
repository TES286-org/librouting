[package]
name = "lr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core primitives, codec traits, generic FSM and RIB traits for librouting"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
# lr-core is the protocol-independent foundation: addresses, codec
# traits, the generic FSM, RIB traits and wire utilities (CRC, Fletcher).
# It deliberately carries no third-party dependencies on the default
# feature set — the crate stays `no_std`-friendly and compiles in
# seconds. The previously-listed `bytes`, `thiserror`, `tracing`,
# `bitflags`, `serde` and `once_cell` dependencies were never imported
# by any module in `src/`; removing them shrinks the dependency graph
# and silences the `cargo::unused_dependencies` warnings a clean
# `cargo build --workspace` emitted.
