[package]
name = "lr-osroute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OS routing table reference implementation (Linux netlink, BSD route socket, Windows IPHelper)"

keywords = ["routing", "netlink", "rtnetlink", "linux"]
categories = ["network-programming", "os"]
# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["std"]
std = ["lr-core/std"]

[dependencies]
lr-core = { workspace = true }
lr-mpls = { workspace = true }
lr-srv6 = { workspace = true }
socket2.workspace = true

# Windows IP Helper API (`GetAdaptersAddresses`, `GetIpForwardTable2`,
# route-table backends). The `windows-sys` crate is Microsoft's
# auto-generated, zero-overhead FFI binding — the struct layouts are
# machine-generated from the official Windows SDK metadata, so they
# cannot drift from the SDK the way hand-rolled `#[repr(C)]` structs
# can (two struct-layout bugs on Windows in this crate's history
# motivated the migration). Only pulled in on `target_os = "windows"`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    # TerminateProcess/GetCurrentProcess for the kernel-gated test
    # harness's self-watchdog (see tests/windows_route_table.rs) —
    # the kernel-mode kill that cannot block on a user-mode lock the
    # way std::process::exit's stdio flush can.
    "Win32_System_Threading",
] }

[dev-dependencies]
lr-ospf = { workspace = true }
