[package]
name = "lr-babel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Babel routing protocol codec, TLVs, neighbor FSM, source-specific routing"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["source_specific"]
source_specific = []

[dependencies]
lr-core = { workspace = true }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake2.workspace = true
hmac.workspace = true
sha2.workspace = true
