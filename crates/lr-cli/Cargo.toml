[package]
name = "lr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI tool and daemon scaffolding for librouting"
keywords = ["bgp", "routing", "cli", "daemon"]
categories = ["network-programming"]

# `bench = false` keeps the binaries' unit tests (libtest harness)
# out of `cargo bench --workspace` — otherwise they run in bench mode
# and reject the criterion-only flags ("Unrecognized option").
[[bin]]
name = "lr"
path = "src/main.rs"
bench = false

[[bin]]
name = "lr-daemon"
path = "src/daemon.rs"
bench = false

[dependencies]
lr-core = { workspace = true }
lr-babel = { workspace = true }
socket2.workspace = true
lr-bgp = { workspace = true }
lr-ospf = { workspace = true }
lr-rib = { workspace = true }
lr-policy = { workspace = true, features = ["bgp", "damping"] }
lr-router = { workspace = true }
lr-bfd = { workspace = true }
lr-bmp = { workspace = true }
lr-ldp = { workspace = true }
lr-mrt = { workspace = true }
lr-osroute = { workspace = true }
lr-mpls = { workspace = true }
lr-damping = { workspace = true }
siphasher.workspace = true

[features]
default = ["std"]
std = []
# W6.3 exchange-plane prototype (docs/research/EXCHANGE-PLANE.md):
# forwards to lr-router -> lr-bgp. Off by default; the release build
# carries none of the exchange-plane code until enabled.
exchange-plane = ["lr-router/exchange-plane"]
