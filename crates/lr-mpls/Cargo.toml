[package]
name = "lr-mpls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MPLS label and label-stack codec (RFC 3032) for librouting"

# `cargo bench --workspace -- <criterion args>` passes the args to
# every bench-enabled target; without this the lib unit tests
# (libtest harness) would run in bench mode and reject the
# criterion-only flags with "Unrecognized option". Criterion
# benches live in the explicit [[bench]] targets below.
[lib]
bench = false

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
# lr-mpls is a standalone MPLS label / label-stack codec (RFC 3032
# §2.1, RFC 8277 §3). It uses no lr-core types — the label stack is
# a pure byte sequence — so the `lr-core` dependency previously
# declared here was never imported.
