[package]
name = "lr-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Layer-3 router instance, sessions, scheduler, event dispatch"

[features]
default = ["labeled_unicast"]
# Forward to lr-bgp so consumers gating on lr-router's feature see the
# same code paths compiled in. Disabling this requires also disabling
# lr-bgp's `labeled_unicast` feature.
labeled_unicast = ["lr-bgp/labeled_unicast"]
# W6.3 exchange-plane prototype (docs/research/EXCHANGE-PLANE.md):
# forward to lr-bgp; adds the record attach/detach plumbing to the
# router (session configuration, record exposure, partial-transit
# counter).
exchange-plane = ["lr-bgp/exchange-plane"]

[dependencies]
lr-core = { workspace = true }
lr-bgp = { workspace = true }
lr-ospf = { workspace = true }
lr-babel = { workspace = true }
lr-rib = { workspace = true }
lr-policy = { workspace = true }
lr-bmp = { workspace = true }
lr-mpls = { workspace = true }
tracing.workspace = true
