name: CI

on:
  push:
    branches: [main, "probe/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# NOTE on timeouts: GitHub Actions' default job timeout is 360
# minutes (6 h). Past incidents saw the macOS runner hit that
# ceiling on a single hung `cargo test` step — every commit then
# cost a full 6 h before a clean "cancelled" signal. Each job and
# each long-running step below now carries an explicit
# `timeout-minutes` so a hang is reported as a failure within
# minutes instead. The ceilings are calibrated to ~6x the worst
# observed legitimate runtime on a cold runner; tighten as needed.

jobs:
  # Lint: fmt + clippy. Fast (~10 min wallclock), runs in parallel
  # with the unit-tests and ffi-bindings jobs below. Clippy builds
  # the workspace once but does not run any tests, so this job is
  # the gate that fails first on a missing doc comment or a lint
  # regression. Splitting it out from the test job means a fmt or
  # clippy failure surfaces in ~10 min instead of after the
  # ~25-min sequential test job.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
      - name: cargo fmt
        timeout-minutes: 5
        run: cargo fmt --all -- --check
      - name: cargo clippy
        timeout-minutes: 15
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Unit + integration tests + doctests. Runs in parallel with lint
  # and ffi-bindings. nextest isolates each test in its own process
  # so a hung test is killed within the slow-timeout window instead
  # of stalling the whole `cargo test` invocation.
  unit-tests:
    name: Unit + integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "unit-tests"
      - name: Install cargo-nextest
        # nextest runs each test in its own process and supports a
        # per-test slow-timeout via .config/nextest.toml, so a hung
        # test is killed (and named in the log) within minutes
        # instead of stalling the whole `cargo test` invocation
        # for the GHA-default 6 h.
        timeout-minutes: 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest (workspace, unit + integration)
        # nextest isolates each test in its own process: a hang in
        # one test no longer takes down the rest of the suite, and
        # .config/nextest.toml's slow-timeout (5 min of no stdout)
        # kills the hung test with a clear "marked as timed out"
        # diagnostic. Combined with the step-level 30 min ceiling,
        # this bounds the historic macOS-runner hang pattern from
        # 6 h down to ≤5 min per hung test.
        timeout-minutes: 30
        run: cargo nextest run --workspace --all-features
      - name: cargo test --doc (workspace)
        # nextest's doctest support is still unstable; the stable
        # path is cargo test --doc. Doctests are typically fast
        # (no daemon spawns), so a 10 min ceiling is generous.
        timeout-minutes: 10
        run: cargo test --doc --workspace --all-features

  # FFI + bindings: C/C++/Python/Go harnesses. Needs release build
  # of lr-ffi (cbindgen regenerates include/lr_ffi.h via build.rs).
  # Runs in parallel with lint + unit-tests; the four harnesses are
  # sequential within the job because they share the release artifact.
  ffi-bindings:
    name: FFI + bindings (C/C++/Python/Go)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ffi-bindings"
      - name: Install system deps
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev gcc g++ cbindgen python3 python3-pip python3-venv \
            golang-go
      - name: Install Python test deps
        timeout-minutes: 5
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install cffi pytest
      - name: Build lr-ffi (release)
        timeout-minutes: 15
        run: cargo build --release -p lr-ffi
      - name: C harness
        timeout-minutes: 5
        run: |
          # NB: sources MUST come before -l: Ubuntu's default `ld --as-needed`
          # drops a shared library that appears before the objects that
          # reference its symbols.
          cc -Iinclude tests/ffi/harness.c -Ltarget/release -llr_ffi -o /tmp/lr_harness
          LD_LIBRARY_PATH=target/release /tmp/lr_harness
      - name: C++ harness (librouting.hpp RAII wrapper)
        timeout-minutes: 5
        run: |
          # The C++ wrapper is header-only (include/librouting.hpp).
          # This step exercises the same FFI surface as the C harness but
          # through the RAII unique_ptr + throwing-API path, so the
          # wrapper itself is covered in CI.
          c++ -std=c++17 -Iinclude tests/ffi/harness.cpp -Ltarget/release -llr_ffi -o /tmp/lr_harness_cpp
          LD_LIBRARY_PATH=target/release /tmp/lr_harness_cpp
      - name: Python bindings test
        timeout-minutes: 10
        run: |
          /tmp/venv/bin/python -m pytest bindings/lr-python/tests -v
          /tmp/venv/bin/python bindings/lr-python/tests/test_librouting.py
      - name: Go bindings test
        timeout-minutes: 10
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/release -llr_ffi"
        run: |
          cd bindings/lr-go && go test -v ./...

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv-1.88"
      - run: cargo --version
      - name: cargo build (workspace, MSRV)
        timeout-minutes: 25
        run: cargo build --workspace --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
      - name: Install tarpaulin
        timeout-minutes: 15
        run: cargo install cargo-tarpaulin --version 0.30.0
      - name: Run coverage
        # --timeout is per-test-process (default 60s); the daemon e2e
        # suites spawn real lr-daemon pairs and under tarpaulin's
        # instrumentation the collision e2e alone can exceed 60s.
        # The step ceiling is 60 min — tarpaulin's whole-workspace
        # coverage run with --timeout 600 typically finishes in
        # ~15-20 min on a warm cache; 60 min gives 3x slack while
        # bounding a hang to a single failed coverage job instead
        # of a 6-hour workflow hang.
        timeout-minutes: 60
        run: cargo tarpaulin --workspace --all-features --out xml --timeout 600
      - uses: codecov/codecov-action@v7
        with:
          files: ./tarpaulin-report.xml
          fail_ci_if_error: false

  cross:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cross-${{ matrix.target }}"
      - name: Install cross linkers
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libgcc-11-dev-arm64-cross \
            gcc-mingw-w64-x86-64
      - name: cargo build (${{ matrix.target }})
        timeout-minutes: 20
        run: cargo build --workspace --target ${{ matrix.target }} --all-features
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

  # Intel macOS coverage now that the macos-13 (Intel) native job is
  # retired (see cross-platform job). The macos-14 (Apple Silicon)
  # runner ships the universal Apple clang that can target both
  # arches; cross-compile to x86_64-apple-darwin from there. This
  # verifies the Intel macOS code path (the lr-osroute BSD backend
  # has no Intel/Apple-Silicon conditional — the route(4) socket
  # ABI is the same — so a build check is sufficient coverage).
  cross-macos-intel:
    name: Cross-build (x86_64-apple-darwin, from macos-14)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cross-x86_64-apple-darwin"
      - name: cargo build (x86_64-apple-darwin)
        timeout-minutes: 20
        run: cargo build --workspace --target x86_64-apple-darwin --all-features

  # Native build + test on the non-Linux primary platforms. The
  # workspace is already target-aware: lr-osroute carries a Windows
  # IP-Helper backend, a BSD/macOS route-socket backend, a Linux
  # rtnetlink backend, and a compile-only stub; lr-cli::signal splits
  # along #[cfg(unix)] / #[cfg(not(unix))]; and every Linux-only
  # kernel-gated test uses #![cfg(target_os = "linux")] so the
  # Windows/macOS runners skip them automatically. The BIRD/FRR interop
  # suite is not portable — it stays on the ubuntu interop job below.
  #
  # ubuntu was dropped from this matrix (conservative dedup): the
  # lint job (fmt + clippy --all-targets) and the unit-tests job
  # (nextest + doctests) already run the identical commands on
  # ubuntu-22.04, so the matrix entry was a full duplicate costing
  # ~25 min of CI time per run. The fmt check was dropped from the
  # matrix for the same reason — rustfmt is deterministic and
  # platform-independent, and the lint job gates it on every push.
  # clippy stays: platform-conditional code (windows/bsd backends)
  # only compiles on its own OS, so per-OS lints are NOT redundant.
  #
  # macOS coverage is Apple Silicon only (macos-14). GitHub Actions
  # retired the Intel macos-13 runner pool in 2025; the runner has
  # been queued-for-hours (sometimes days) every CI run since the
  # Phase 4 matrix landed, blocking the cross-platform signal while
  # the same code paths ran green on macos-14. Intel macOS
  # compilation is still covered by the cross-build matrix below
  # (x86_64-apple-darwin target via the cross job); only the native
  # test execution is dropped. The `lr-osroute` BSD backend is
  # shared between Intel and Apple Silicon macOS (the route(4)
  # socket ABI is the same), so dropping macos-13 loses no
  # platform-conditional code path.
  cross-platform:
    name: Native (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14   # Apple Silicon (Intel macOS retired by GitHub Actions)
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native-${{ matrix.os }}"
      - name: Configure Git PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Install cargo-nextest
        # See rust-tests job for rationale. taiki-e/install-action
        # ships a prebuilt binary for linux/macos/windows, so this
        # step is fast (~10 s) on every matrix entry.
        timeout-minutes: 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo clippy
        # fmt is NOT run here: the lint job (ubuntu) gates formatting on
        # every push/PR and rustfmt output is platform-independent.
        # clippy IS per-OS: the windows/bsd cfg-gated backends only
        # compile on their own platform.
        timeout-minutes: 30
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: cargo build (workspace)
        timeout-minutes: 30
        run: cargo build --workspace --all-features
      - name: cargo nextest (workspace, unit + integration)
        # On Windows the lr-cli daemon tests spawn the daemon binary on
        # loopback TCP sockets. They use std::net primitives that work
        # cross-platform; the lr-osroute Windows backend compiles and
        # its kernel-gated sisters (srv6_kernel, ospf6_kernel) are
        # Linux-only at the file level, so they are excluded by the
        # compiler, not by the test runner.
        #
        # nextest + .config/nextest.toml's slow-timeout is the
        # per-test layer of the hang defense. The historic macOS CI
        # hang lived in this step's `cargo test` equivalent — a
        # Drop impl's blocking `child.wait()` wedged the whole test
        # binary. nextest runs each test in its own process and
        # kills any that produce no output for 5 min, so the same
        # regression would now fail in ≤5 min with the culprit
        # test name in the log, instead of stalling for 6 h.
        timeout-minutes: 30
        run: cargo nextest run --workspace --all-features
      - name: cargo test --doc (workspace)
        # nextest's doctest support is still unstable; the stable
        # path is cargo test --doc.
        timeout-minutes: 10
        run: cargo test --doc --workspace --all-features

  # Windows lr-vs-lr interop. The scripts that don't query the runtime
  # API socket (two_daemon, labeled_unicast, bgp_kernel_install) run
  # end-to-end on windows-2022 via Git Bash. The two that do (addpath,
  # bmp) need a Windows transport for lrctl or a Windows-aware Python
  # client; they stay on the Linux interop job until that lands.
  #
  # bgp_kernel_install.sh additionally exercises the Windows IP-Helper
  # backend end-to-end: the GitHub Windows runner shell is already
  # elevated, so --install-kernel-routes works, and the script asserts
  # the route lands in the kernel FIB (route.exe print), the OS lookup
  # picks it (Find-NetRoute) and the teardown removes it. That is the
  # Windows half of the "learn → install → decide" contract; the full
  # data-plane FORWARD step lives on Linux (netns + QEMU VM harness).
  #
  # Windows FIB semantics probe. MOVED OUT of this workflow: a job
  # gated off the main-line trigger showed up as permanently
  # "skipped" on every push run, which both hid real skips and
  # wasted a runner slot. It now lives in
  # .github/workflows/windows-fib-probe.yml (workflow_dispatch) and
  # is dispatched manually on a disposable branch whenever a Windows
  # build needs its FIB semantics re-audited.

  # The scripts already build the Windows lr-daemon binary via
  # `cargo build -p lr-cli` (the .exe suffix is handled by the
  # shared `tests/interop/_lr_daemon.sh` resolver). The BGP TCP
  # listener binds to 127.0.0.1 — the same loopback path the
  # cross-platform nextest matrix already exercises through the
  # daemon_runtime / daemon_multi_peer tests.
  windows-interop:
    name: Windows interop (lr ↔ lr)
    runs-on: windows-2022
    # Ceiling arithmetic: cold-cache build 25 + three interop script
    # steps (10-min ceilings each, sub-minute observed) + setup ≈ 57
    # worst case; the typical warm run finishes in ~3.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-interop"
      - name: Configure Git PATH (bash + grep + kill)
        # Git Bash ships the POSIX tools the interop scripts depend
        # on (bash, grep, kill, sleep, seq). The same env tweak the
        # cross-platform matrix uses; safe to repeat here because
        # GITHUB_PATH appends.
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Build lr-daemon (debug)
        # Debug build is faster than release and the interop scripts
        # don't need the optimised codec path. The shared
        # _lr_daemon.sh resolver checks debug before release.
        timeout-minutes: 25
        run: cargo build -p lr-cli
      - name: Two-daemon TCP interop (lr ↔ lr)
        timeout-minutes: 10
        shell: bash
        run: ./tests/interop/two_daemon.sh
      - name: RFC 8277 labelled-unicast interop (lr ↔ lr)
        timeout-minutes: 10
        shell: bash
        run: ./tests/interop/labeled_unicast.sh
      - name: BGP kernel-route install interop (IP-Helper backend)
        # The runner shell is an Administrator shell, so the daemon's
        # CreateIpForwardEntry2 path works without any elevation step;
        # the script's Windows branch verifies the FIB install, the
        # Find-NetRoute decision and the teardown, and cleans up the
        # crash-stale route at the end.
        timeout-minutes: 10
        shell: bash
        run: ./tests/interop/bgp_kernel_install.sh

      # NOTE: the four #[ignore]d windows_route_table kernel-gated
      # tests (fib_semantics_probe_matrix, probe_next_hop_interface_
      # resolution, blackhole_route_discards_not_accepts,
      # explicit_oif_beats_fib_resolution) do NOT run in this job.
      # They wedged this step on SIXTEEN consecutive runs (36125163593
      # through 36217837148) across every harness shape: plain
      # `timeout N cargo test`, file-stdio children, an in-binary
      # kernel-mode TerminateProcess watchdog, timestamped
      # transcripts, bash-level taskkill //F //T tree kills, compiling
      # from PowerShell, running the test binary directly, console-less
      # CREATE_NO_WINDOW grandchildren, and finally a pure-PowerShell
      # step with detached launches and bounded WaitForExit budgets —
      # after which the pwsh script provably finished (its loop is
      # bounded at 4 x 360 s) and the runner STILL could not finalise
      # the step for 37+ minutes. The mechanism that fits every
      # observation: a process wedged in an UNINTERRUPTIBLE kernel
      # call (netio) is marked for death by TerminateProcess but never
      # reaped, and the runner's step-finalisation waits on it — no
      # workflow-level process management can fix that. The unit-level
      # coverage of the Windows backend runs (and passes) in the
      # Native (windows-2022) job; the kernel-gated suite runs through
      # windows-fib-probe.yml — a per-test job matrix whose transcripts
      # are committed back even when a test wedges its own job — and
      # the kernel-level hang itself is tracked in issue #29
      # (https://github.com/TES286-org/librouting/issues/29).
      #
      # Removing the step also un-blocks this job's cache: with the
      # wedge gone, the post-run cache save finally happens, so the
      # cold-build penalty stops compounding on every push.

  # macOS lr-vs-lr interop + the BSD route(4) backend end-to-end.
  # This is the macOS half of the "CI reflects real usage" goal:
  # before this job the BSD backend was only ever cross-compiled
  # (cross-macos-intel), never executed. The macos-14 runner has
  # passwordless sudo, so bgp_kernel_install.sh runs its daemons
  # elevated (the PF_ROUTE socket needs root) and asserts the
  # learn → install → decide → teardown chain against the real macOS
  # kernel FIB via netstat/route. two_daemon + labeled_unicast cover
  # the plain control-plane path without sudo.
  macos-interop:
    name: macOS interop (lr ↔ lr, BSD route socket)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-interop"
      - name: Build lr-daemon (debug)
        timeout-minutes: 25
        run: cargo build -p lr-cli
      - name: Two-daemon TCP interop (lr ↔ lr)
        timeout-minutes: 10
        shell: bash
        run: ./tests/interop/two_daemon.sh
      - name: RFC 8277 labelled-unicast interop (lr ↔ lr)
        timeout-minutes: 10
        shell: bash
        run: ./tests/interop/labeled_unicast.sh
      - name: BGP kernel-route install interop (BSD route(4) backend)
        # sudo is passwordless on GitHub macOS runners; the script
        # elevates the daemons itself (pidfile-tracked real pids) and
        # verifies netstat -rn / route -n get / teardown. Prefixes are
        # RFC 5737 documentation blocks, so a stale route on the shared
        # runner cannot hijack real traffic.
        timeout-minutes: 10
        shell: bash
        run: ./tests/interop/bgp_kernel_install.sh

  # Windows lr-vs-BIRD interop via WSL2. The Windows runner ships
  # WSL2 + Ubuntu 22.04 by default; the bird_wsl.sh script installs
  # bird2 inside WSL2, starts BIRD, and runs lr-daemon.exe on the
  # Windows host against it. The TCP path goes through WSL2's
  # automatic localhost forwarding — BIRD inside WSL2 connecting to
  # 127.0.0.1:LR_PORT reaches lr-daemon.exe's listener on the Windows
  # host.
  #
  # The script also runs on Linux (where it uses the host-installed
  # bird binary via apt-get install bird2 — the existing Linux CI
  # already covers that path through bird.sh, so the WSL2 path is the
  # novel coverage on Windows).
  #
  # Hard gate: the WSL2 bootstrap has been green on every run since
  # the rootfs import + wslu path-translation fixes landed, so the
  # early `continue-on-error: true` stabilisation period is over. A
  # failure here now means a real interop regression, not runner flake.
  windows-bird-interop:
    name: Windows BIRD interop (lr ↔ BIRD-in-WSL2)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-bird-interop"
      - name: Configure Git PATH (bash + grep + kill)
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Build lr-daemon (debug)
        timeout-minutes: 25
        run: cargo build -p lr-cli
      - name: BIRD-in-WSL2 interop (lr ↔ BIRD 2)
        # The script SKIPs gracefully if WSL2+Ubuntu is unavailable
        # or no host bird binary is on PATH; a real interop failure
        # (no route exchange, session never established) is a hard
        # error for this job.
        timeout-minutes: 15
        shell: bash
        run: ./tests/interop/bird_wsl.sh

  # Real-world interop: exchange BGP with BIRD and FRR (FRR's bgpd) on
  # loopback TCP sockets and verify routes propagate in both directions.
  # The scripts skip gracefully when the daemon binaries are absent, so the
  # job also works on forked runners without the packages.
  interop:
    name: Interop (BIRD + FRR)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "interop"
      - name: Install reference daemons
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bird2 frr iproute2 tcpdump libyang-tools
      - name: Build lr-daemon
        timeout-minutes: 15
        run: cargo build -p lr-cli
      - name: Build the RTR mock cache example
        timeout-minutes: 10
        run: cargo build -p lr-bgp --example rtr_cache_mock
      - name: RTR codec interop (RFC 8210, lr-bgp mock cache x BIRD 2 rpki)
        timeout-minutes: 5
        run: ./tests/interop/rtr_bird.sh
      - name: RTR daemon e2e (RFC 8210, lr-daemon [bgp.rpki] x lr-bgp mock cache)
        timeout-minutes: 5
        run: ./tests/interop/rtr_lr.sh
      - name: Two-daemon interop (librouting ↔ librouting)
        timeout-minutes: 5
        run: ./tests/interop/two_daemon.sh
      - name: RFC 8277 labelled-unicast interop (librouting ↔ librouting)
        timeout-minutes: 5
        run: ./tests/interop/labeled_unicast.sh
      - name: BGP kernel-install interop (learn → install → decide → forward → teardown)
        # The user contract this repo promises: a BGP-learned route is
        # installed into the kernel FIB (proto bgp), the OS lookup uses
        # it, real ICMP packets are delivered through it, and the peer's
        # death withdraws it. Rootless user namespaces support every
        # step (the FORWARD ping is locally-originated + locally-
        # delivered, so no ip_forward is needed); the transit-forwarding
        # phase lives in bgp_transit.sh below + the nightly VM harness.
        timeout-minutes: 10
        run: ./tests/interop/bgp_kernel_install.sh
      - name: BGP transit interop (three-router re-advertisement + far-edge FIB)
        # A route learned on edge r1 must survive the transit router's
        # re-advertisement into r3's kernel FIB; the ip_forward data
        # phase runs in the QEMU VM harness (nightly) where root is
        # available, and SKIPs cleanly in this rootless job.
        timeout-minutes: 10
        run: ./tests/interop/bgp_transit.sh
      - name: "BGP transit forwarding (rootful: ip_forward + pcap-verified transit)"
        # The data-plane half of bgp_transit.sh as real root: the
        # runner's sudo writes net.ipv4.ip_forward inside the script's
        # plain net namespace (a rootless user namespace cannot), so
        # phase 4 genuinely runs — the ICMP echo request is captured on
        # BOTH of r2's transit interfaces (pcap_sniff.py icmp mode +
        # pcap_icmp_check.py) and the identical (id, seq) pair on ingress
        # and egress is asserted. LR_REQUIRE_FORWARD=1 turns a skip into
        # a failure so this job cannot silently regress the dataplane.
        timeout-minutes: 10
        env:
          LR_REQUIRE_FORWARD: "1"
        run: sudo -E ./tests/interop/bgp_transit.sh
      - name: Add-Path interop (RFC 7911, two-daemon)
        timeout-minutes: 5
        run: ./tests/interop/addpath.sh
      - name: RFC 8277 BGP-LU -> MPLS dataplane interop (kernel-gated, user namespace)
        timeout-minutes: 10
        run: ./tests/interop/mpls_lsp.sh
      - name: SRv6 seg6/seg6local kernel interop (RFC 8754 / RFC 8986, kernel-gated)
        timeout-minutes: 10
        run: |
          cargo test -p lr-osroute --test srv6_kernel --all-features --no-run
          # Run inside a rootless user+net namespace like the
          # route_kernel step below: a bare runner process lacks
          # CAP_NET_ADMIN, so every install used to die with EPERM and
          # the #[ignore]d tests passed as vacuous SKIPs (run
          # 36121452689's "SKIP: add_seg6local_route returned EPERM").
          # The user namespace grants CAP_NET_ADMIN over the new netns;
          # seg6_enabled is per-netns and defaults to 0, so it is
          # enabled inside that netns before the tests run. lo is
          # brought up too: it is the tests' egress device, and a fresh
          # netns starts with it down (newer kernels refuse a down
          # egress with ENETDOWN).
          unshare -Urn bash -c '
            set -euo pipefail
            ip link set lo up
            sysctl -w net.ipv6.conf.all.seg6_enabled=1
            sysctl -w net.ipv6.conf.lo.seg6_enabled=1
            cargo test -p lr-osroute --test srv6_kernel --all-features -- --ignored --nocapture --test-threads=1
          '
      - name: Route-table backend kernel tests (Linux netlink, rootless netns)
        # Real-kernel round trips the mock-socket unit tests cannot prove:
        # blackhole install → delete (the RTN_UNSPEC withdrawal fix — a
        # delete naming RTN_UNICAST never matched an RTN_BLACKHOLE row on
        # IPv4 and the blackhole stayed in the kernel), idempotent
        # withdrawal (-ESRCH mapped to success), and tagged unicast
        # v4/v6 round trips. #[ignore]-gated like srv6_kernel; the
        # rootless user+net namespace grants CAP_NET_ADMIN so they
        # genuinely run here, and they skip cleanly elsewhere.
        timeout-minutes: 5
        run: |
          cargo test -p lr-osroute --test route_kernel --no-run
          unshare -Urn cargo test -p lr-osroute --test route_kernel -- --ignored --nocapture
      - name: OSPF two-daemon interop (raw sockets, user namespace)
        timeout-minutes: 10
        run: ./tests/interop/ospf.sh
      - name: "OSPF transit forwarding (rootful: ip_forward data plane)"
        # Phase 4 of ospf.sh as real root — the ip_forward-gated ICMP
        # transit that rootless namespaces cannot enable. Same
        # LR_REQUIRE_FORWARD contract as the BGP transit step above.
        timeout-minutes: 10
        env:
          LR_REQUIRE_FORWARD: "1"
        run: sudo -E ./tests/interop/ospf.sh
      - name: Babel MAC auth e2e (RFC 8967 + RFC 9467, two daemons)
        timeout-minutes: 10
        run: ./tests/interop/babel_auth.sh
      - name: Babel multi-NIC pattern matching (RFC 8966 §A.2, lr ↔ lr)
        timeout-minutes: 10
        run: ./tests/interop/babel_multi_nic.sh
      - name: Babel multi-session transit + check link (RFC 8966, lr ↔ lr)
        timeout-minutes: 10
        run: ./tests/interop/babel_multihop.sh
      - name: Babel v6-only tunnel + extended_next_hop + blackhole (RFC 5549, lr ↔ BIRD, pcap)
        timeout-minutes: 10
        run: ./tests/interop/babel_v6only_extended.sh
      - name: "Babel dual-stack BIRD interop (full production topology, v4-on-v6, forwarding, BGP-over-Babel, pcap)"
        # The complete reproduction of the reported Windows production
        # scenario: dual-stack babel link, both sides originating the same
        # aggregates (Loc-RIB preference), real ICMP delivery through the
        # Babel-installed kernel routes, a BGP session to a
        # Babel-only-reachable peer, and packet-capture TLV analysis
        # (babel_decode.py) of the announcements both daemons put on the
        # wire. BIRD 2.x (this runner's bird2) accepts the AE 1
        # v4-over-v6 form; the AE 4 (RFC 9229) path is covered by the
        # v6-only job above at the emission level and hard-asserted on
        # BIRD >= 3.
        timeout-minutes: 10
        run: ./tests/interop/babel_dualstack_bird.sh
      - name: OSPF x BIRD interop (real DBD/LSR exchange, RFC 2328 7.2)
        timeout-minutes: 10
        run: ./tests/interop/ospf_bird.sh
      - name: OSPF x FRR interop (real DBD/LSR exchange, RFC 2328 7.2)
        timeout-minutes: 10
        run: ./tests/interop/ospf_frr.sh
      - name: OSPF broadcast interop (RFC 2328 9.4 DR election, lr x lr + lr x BIRD)
        timeout-minutes: 10
        run: ./tests/interop/ospf_broadcast.sh
      - name: OSPF graceful restart interop (RFC 3623, two daemons)
        timeout-minutes: 10
        run: ./tests/interop/ospf_gr.sh
      - name: OSPF graceful restart x BIRD helper (RFC 3623)
        timeout-minutes: 10
        run: ./tests/interop/ospf_gr_bird.sh
      - name: OSPF Segment Routing interop (RFC 8665 slice 1, lr x FRR ospfd)
        timeout-minutes: 10
        run: ./tests/interop/ospf_sr_frr.sh
      - name: OSPF Segment Routing interop (RFC 8665 slice 2 reception, lr x lr)
        timeout-minutes: 10
        run: ./tests/interop/ospf_sr.sh
      - name: OSPF SR adjacency + mapping server interop (RFC 8665 slice 3, lr x lr)
        timeout-minutes: 10
        run: ./tests/interop/ospf_sr_adj.sh
      - name: OSPFv3 two-daemon interop (RFC 5340, raw IPv6 sockets, user namespace)
        timeout-minutes: 10
        run: ./tests/interop/ospf6.sh
      - name: OSPFv3 Extended-LSA interop (RFC 8362, two daemons)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_e_lsa.sh
      - name: OSPFv3 SRv6 End.X interop (RFC 9513 9.1 over RFC 8362, sparse mode)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_e_lsa_endx.sh
      - name: OSPFv3 SRv6 LAN End.X interop (RFC 9513 9.2, three-router broadcast segment)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_e_lsa_endx_lan.sh
      - name: OSPFv3 broadcast interop (RFC 5340 4.1.2 election, lr x lr)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_broadcast.sh
      - name: OSPFv3 x FRR ospf6d interop (RFC 5340, real DBD/LSR exchange)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_frr.sh
      - name: OSPFv3 broadcast x FRR ospf6d interop (RFC 5340 4.1.2, default FRR type)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_frr_broadcast.sh
      - name: OSPFv3 graceful restart interop (RFC 5187, two daemons)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_gr.sh
      - name: OSPFv3 graceful restart x FRR ospf6d helper (RFC 5187)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_gr_frr.sh
      - name: OSPFv3 SRv6 interop (RFC 9513, lr x FRR relay x lr)
        timeout-minutes: 10
        run: ./tests/interop/ospf6_frr_srv6.sh
      - name: MRT interop (BIRD dump -> lr parse; daemon Loc-RIB round-trip)
        timeout-minutes: 10
        run: ./tests/interop/mrt.sh
      - name: Wire-level parity harness (replay captured stream, diff Loc-RIBs)
        timeout-minutes: 10
        run: ./tests/interop/parity.sh
      - name: BMP collector e2e (daemon mirroring -> daemon collector)
        timeout-minutes: 10
        run: ./tests/interop/bmp.sh
      - name: BGP MD5 auth interop (RFC 2385)
        timeout-minutes: 10
        run: ./tests/interop/md5.sh
      - name: Multi-protocol interop (rc.3, lr --protocol bgp,ospf ↔ BIRD ospf+bgp)
        timeout-minutes: 10
        run: ./tests/interop/multi_protocol.sh
      - name: BIRD interop (librouting ↔ BIRD)
        timeout-minutes: 10
        run: ./tests/interop/bird.sh
      - name: Filter DSL + ROA interop (BIRD 2 filter → lr DSL)
        timeout-minutes: 10
        run: ./tests/interop/filter_dsl_bird.sh
      - name: BIRD compat interop (lr-daemon runs a BIRD config natively ↔ BIRD)
        timeout-minutes: 10
        run: ./tests/interop/compat_bird.sh
      - name: FRR compat interop (lr-daemon runs an FRR config natively ↔ bgpd)
        timeout-minutes: 10
        run: ./tests/interop/compat_frr.sh
      - name: BIRD IPv6 interop (librouting ↔ BIRD, pure IPv6)
        timeout-minutes: 10
        run: ./tests/interop/bird_ipv6.sh
      - name: BIRD GTSM interop (librouting ↔ BIRD, RFC 5082)
        timeout-minutes: 10
        run: ./tests/interop/bird_gtsm.sh
      - name: BIRD ENH interop (librouting ↔ BIRD, RFC 5549)
        timeout-minutes: 10
        run: ./tests/interop/bird_enh.sh
      - name: BIRD LLGR interop (librouting ↔ BIRD, RFC 9494)
        timeout-minutes: 10
        run: ./tests/interop/bird_llgr.sh
      - name: BFD interop (librouting ↔ BIRD, RFC 5880/5881/5883)
        timeout-minutes: 10
        run: ./tests/interop/bfd_bird.sh
      - name: LDP two-daemon interop (RFC 5036, multicast discovery, user namespace)
        timeout-minutes: 10
        run: ./tests/interop/ldp.sh
      - name: LDP interop (librouting ↔ FRR ldpd, RFC 5036)
        timeout-minutes: 10
        run: ./tests/interop/ldp_frr.sh
      - name: LDP x FRR dual-stack interop (RFC 7552, zebra + ldpd)
        timeout-minutes: 10
        run: ./tests/interop/ldp_frr_v6.sh
      - name: FRR interop (librouting ↔ FRR bgpd)
        timeout-minutes: 10
        run: ./tests/interop/frr.sh
      - name: Redistribution interop (BGP↔OSPF pipes ↔ BIRD 2, ROADMAP-v3 D4.5)
        timeout-minutes: 10
        run: ./tests/interop/redistribute_bird.sh
      - name: Aggregation interop (RFC 4271 9.2.2.2 ↔ BIRD 2, ROADMAP-v3 D4.5)
        timeout-minutes: 10
        run: ./tests/interop/aggregate_bird.sh
      - name: Route flap damping interop (RFC 2439 ↔ FRR bgpd, ROADMAP-v3 D4.5)
        timeout-minutes: 10
        run: ./tests/interop/damping_frr.sh
      - name: RFC 8212 interop (default eBGP policy ↔ BIRD 2, ROADMAP-v3 D10.6)
        timeout-minutes: 10
        run: ./tests/interop/rfc8212_bird.sh
      - name: RFC 8212 interop (default eBGP policy ↔ FRR bgpd, ROADMAP-v3 D10.6)
        timeout-minutes: 10
        run: ./tests/interop/rfc8212_frr.sh
      - name: YANG surface gate (RFC 9647 + RFC 8177, libyang when present)
        timeout-minutes: 10
        run: ./tests/interop/yang.sh
      # W6.3 exchange-plane exit criteria (docs/research/EXCHANGE-PLANE.md
      # §10): rebuild the daemon with the feature, then
      #   - the W5.3 parity harness (flag off) must stay byte-identical,
      #   - a plane-enabled daemon must peer with plain BIRD unchanged
      #     (the RFC 5492 §3 fallback gate). The flag-off interop steps
      #     above were run against the plain build; the loopback e2e
      #     with the flag on lives in crates/lr-cli/tests (rust-tests).
      - name: Rebuild lr-daemon with the exchange-plane feature
        timeout-minutes: 15
        run: cargo build -p lr-cli --features exchange-plane
      - name: Wire-level parity gate with the exchange-plane build (flag off)
        timeout-minutes: 10
        run: ./tests/interop/parity.sh
      - name: Exchange-plane fallback gate (plane on ↔ plain BIRD 2)
        timeout-minutes: 10
        run: ./tests/interop/exchange_plane.sh

  # TCP-AO needs Linux >= 6.7: ubuntu-24.04 ships a 6.8 kernel. The
  # script itself skips gracefully when the option is missing, so this
  # job also doubles as a rolling check on newer kernels/packages.
  interop-auth:
    name: Interop auth (TCP-AO, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "interop-auth"
      - name: Install reference daemons
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bird2 frr iproute2
      - name: Build lr-daemon
        timeout-minutes: 15
        run: cargo build -p lr-cli
      - name: TCP-AO two-daemon interop (kernel-gated)
        timeout-minutes: 10
        run: ./tests/interop/tcp_ao.sh
      - name: MD5 auth interop (RFC 2385, incl. BIRD/FRR)
        timeout-minutes: 10
        run: ./tests/interop/md5.sh
