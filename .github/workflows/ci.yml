name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-tests:
    name: Rust fmt + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-tests"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev gcc g++ cbindgen python3 python3-pip python3-venv \
            golang-go
      - name: Install Python test deps
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install cffi pytest
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --all-features
      - name: Build lr-ffi (release)
        run: cargo build --release -p lr-ffi
      - name: C harness
        run: |
          # NB: sources MUST come before -l: Ubuntu's default `ld --as-needed`
          # drops a shared library that appears before the objects that
          # reference its symbols.
          cc -Iinclude tests/ffi/harness.c -Ltarget/release -llr_ffi -o /tmp/lr_harness
          LD_LIBRARY_PATH=target/release /tmp/lr_harness
      - name: C++ harness (librouting.hpp RAII wrapper)
        run: |
          # The C++ wrapper is header-only (include/librouting.hpp).
          # This step exercises the same FFI surface as the C harness but
          # through the RAII unique_ptr + throwing-API path, so the
          # wrapper itself is covered in CI.
          c++ -std=c++17 -Iinclude tests/ffi/harness.cpp -Ltarget/release -llr_ffi -o /tmp/lr_harness_cpp
          LD_LIBRARY_PATH=target/release /tmp/lr_harness_cpp
      - name: Python bindings test
        run: |
          /tmp/venv/bin/python -m pytest bindings/lr-python/tests -v
          /tmp/venv/bin/python bindings/lr-python/tests/test_librouting.py
      - name: Go bindings test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/release -llr_ffi"
        run: |
          cd bindings/lr-go && go test -v ./...
      - name: Two-daemon TCP interop test
        run: |
          cargo build -p lr-cli
          ./tests/interop/two_daemon.sh
      - name: Add-Path interop (RFC 7911, two-daemon)
        run: |
          ./tests/interop/addpath.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv-1.88"
      - run: cargo --version
      - run: cargo build --workspace --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.30.0
      - name: Run coverage
        # --timeout is per-test-process (default 60s); the daemon e2e
        # suites spawn real lr-daemon pairs and under tarpaulin's
        # instrumentation the collision e2e alone can exceed 60s.
        run: cargo tarpaulin --workspace --all-features --out xml --timeout 600
      - uses: codecov/codecov-action@v4
        with:
          files: ./tarpaulin-report.xml
          fail_ci_if_error: false

  cross:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cross-${{ matrix.target }}"
      - name: Install cross linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libgcc-11-dev-arm64-cross \
            gcc-mingw-w64-x86-64
      - name: cargo build (${{ matrix.target }})
        run: cargo build --workspace --target ${{ matrix.target }} --all-features
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

  # Real-world interop: exchange BGP with BIRD and FRR (FRR's bgpd) on
  # loopback TCP sockets and verify routes propagate in both directions.
  # The scripts skip gracefully when the daemon binaries are absent, so the
  # job also works on forked runners without the packages.
  interop:
    name: Interop (BIRD + FRR)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "interop"
      - name: Install reference daemons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bird2 frr iproute2
      - name: Build lr-daemon
        run: cargo build -p lr-cli
      - name: Two-daemon interop (librouting ↔ librouting)
        run: ./tests/interop/two_daemon.sh
      - name: RFC 8277 labelled-unicast interop (librouting ↔ librouting)
        run: ./tests/interop/labeled_unicast.sh
      - name: RFC 8277 BGP-LU -> MPLS dataplane interop (kernel-gated, user namespace)
        run: ./tests/interop/mpls_lsp.sh
      - name: SRv6 seg6/seg6local kernel interop (RFC 8754 / RFC 8986, kernel-gated)
        run: |
          sudo sysctl -w net.ipv6.conf.all.seg6_enabled=1 || true
          sudo sysctl -w net.ipv6.conf.lo.seg6_enabled=1 || true
          # The tests are #[ignore] (kernel-gated). They skip cleanly
          # when seg6 is unavailable or when the process lacks
          # CAP_NET_ADMIN — the wire format itself is pinned by the
          # 17 unit tests in seg6_route.rs that run unconditionally in
          # the cargo test --workspace step above.
          cargo test -p lr-osroute --test srv6_kernel --all-features -- --ignored --nocapture
      - name: OSPF two-daemon interop (raw sockets, user namespace)
        run: ./tests/interop/ospf.sh
      - name: Babel MAC auth e2e (RFC 8967 + RFC 9467, two daemons)
        run: ./tests/interop/babel_auth.sh
      - name: OSPF x BIRD interop (real DBD/LSR exchange, RFC 2328 7.2)
        run: ./tests/interop/ospf_bird.sh
      - name: OSPF x FRR interop (real DBD/LSR exchange, RFC 2328 7.2)
        run: ./tests/interop/ospf_frr.sh
      - name: OSPF broadcast interop (RFC 2328 9.4 DR election, lr x lr + lr x BIRD)
        run: ./tests/interop/ospf_broadcast.sh
      - name: OSPF graceful restart interop (RFC 3623, two daemons)
        run: ./tests/interop/ospf_gr.sh
      - name: OSPF graceful restart x BIRD helper (RFC 3623)
        run: ./tests/interop/ospf_gr_bird.sh
      - name: OSPF Segment Routing interop (RFC 8665 slice 1, lr x FRR ospfd)
        run: ./tests/interop/ospf_sr_frr.sh
      - name: OSPF Segment Routing interop (RFC 8665 slice 2 reception, lr x lr)
        run: ./tests/interop/ospf_sr.sh
      - name: OSPF SR adjacency + mapping server interop (RFC 8665 slice 3, lr x lr)
        run: ./tests/interop/ospf_sr_adj.sh
      - name: MRT interop (BIRD dump -> lr parse; daemon Loc-RIB round-trip)
        run: ./tests/interop/mrt.sh
      - name: Wire-level parity harness (replay captured stream, diff Loc-RIBs)
        run: ./tests/interop/parity.sh
      - name: BMP collector e2e (daemon mirroring -> daemon collector)
        run: ./tests/interop/bmp.sh
      - name: BGP MD5 auth interop (RFC 2385)
        run: ./tests/interop/md5.sh
      - name: BIRD interop (librouting ↔ BIRD)
        run: ./tests/interop/bird.sh
      - name: BIRD compat interop (lr-daemon runs a BIRD config natively ↔ BIRD)
        run: ./tests/interop/compat_bird.sh
      - name: FRR compat interop (lr-daemon runs an FRR config natively ↔ bgpd)
        run: ./tests/interop/compat_frr.sh
      - name: BIRD IPv6 interop (librouting ↔ BIRD, pure IPv6)
        run: ./tests/interop/bird_ipv6.sh
      - name: BIRD GTSM interop (librouting ↔ BIRD, RFC 5082)
        run: ./tests/interop/bird_gtsm.sh
      - name: BIRD ENH interop (librouting ↔ BIRD, RFC 5549)
        run: ./tests/interop/bird_enh.sh
      - name: BIRD LLGR interop (librouting ↔ BIRD, RFC 9494)
        run: ./tests/interop/bird_llgr.sh
      - name: BFD interop (librouting ↔ BIRD, RFC 5880/5881/5883)
        run: ./tests/interop/bfd_bird.sh
      - name: LDP two-daemon interop (RFC 5036, multicast discovery, user namespace)
        run: ./tests/interop/ldp.sh
      - name: LDP interop (librouting ↔ FRR ldpd, RFC 5036)
        run: ./tests/interop/ldp_frr.sh
      - name: LDP x FRR dual-stack interop (RFC 7552, zebra + ldpd)
        run: ./tests/interop/ldp_frr_v6.sh
      - name: FRR interop (librouting ↔ FRR bgpd)
        run: ./tests/interop/frr.sh
      - name: YANG surface gate (RFC 9647 + RFC 8177, libyang when present)
        run: ./tests/interop/yang.sh
      # W6.3 exchange-plane exit criteria (docs/research/EXCHANGE-PLANE.md
      # §10): rebuild the daemon with the feature, then
      #   - the W5.3 parity harness (flag off) must stay byte-identical,
      #   - a plane-enabled daemon must peer with plain BIRD unchanged
      #     (the RFC 5492 §3 fallback gate). The flag-off interop steps
      #     above were run against the plain build; the loopback e2e
      #     with the flag on lives in crates/lr-cli/tests (rust-tests).
      - name: Rebuild lr-daemon with the exchange-plane feature
        run: cargo build -p lr-cli --features exchange-plane
      - name: Wire-level parity gate with the exchange-plane build (flag off)
        run: ./tests/interop/parity.sh
      - name: Exchange-plane fallback gate (plane on ↔ plain BIRD 2)
        run: ./tests/interop/exchange_plane.sh

  # TCP-AO needs Linux >= 6.7: ubuntu-24.04 ships a 6.8 kernel. The
  # script itself skips gracefully when the option is missing, so this
  # job also doubles as a rolling check on newer kernels/packages.
  interop-auth:
    name: Interop auth (TCP-AO, ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "interop-auth"
      - name: Install reference daemons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bird2 frr iproute2
      - name: Build lr-daemon
        run: cargo build -p lr-cli
      - name: TCP-AO two-daemon interop (kernel-gated)
        run: ./tests/interop/tcp_ao.sh
      - name: MD5 auth interop (RFC 2385, incl. BIRD/FRR)
        run: ./tests/interop/md5.sh
