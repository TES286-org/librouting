name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-tests:
    name: Rust fmt + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-tests"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev gcc g++ cbindgen python3 python3-pip python3-venv \
            golang-go
      - name: Install Python test deps
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install cffi pytest
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --all-features
      - name: Build lr-ffi (release)
        run: cargo build --release -p lr-ffi
      - name: C harness
        run: |
          # NB: sources MUST come before -l: Ubuntu's default `ld --as-needed`
          # drops a shared library that appears before the objects that
          # reference its symbols.
          cc -Iinclude tests/ffi/harness.c -Ltarget/release -llr_ffi -o /tmp/lr_harness
          LD_LIBRARY_PATH=target/release /tmp/lr_harness
      - name: Python bindings test
        run: |
          /tmp/venv/bin/python -m pytest bindings/lr-python/tests -v
          /tmp/venv/bin/python bindings/lr-python/tests/test_librouting.py
      - name: Go bindings test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/release -llr_ffi"
        run: |
          cd bindings/lr-go && go test -v ./...
      - name: Two-daemon TCP interop test
        run: |
          cargo build -p lr-cli
          ./tests/interop/two_daemon.sh
      - name: Add-Path interop (RFC 7911, two-daemon)
        run: |
          ./tests/interop/addpath.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv-1.88"
      - run: cargo --version
      - run: cargo build --workspace --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.30.0
      - name: Run coverage
        run: cargo tarpaulin --workspace --all-features --out xml
      - uses: codecov/codecov-action@v4
        with:
          files: ./tarpaulin-report.xml
          fail_ci_if_error: false

  cross:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cross-${{ matrix.target }}"
      - name: Install cross linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libgcc-11-dev-arm64-cross \
            gcc-mingw-w64-x86-64
      - name: cargo build (${{ matrix.target }})
        run: cargo build --workspace --target ${{ matrix.target }} --all-features
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

  # Real-world interop: exchange BGP with BIRD and FRR (FRR's bgpd) on
  # loopback TCP sockets and verify routes propagate in both directions.
  # The scripts skip gracefully when the daemon binaries are absent, so the
  # job also works on forked runners without the packages.
  interop:
    name: Interop (BIRD + FRR)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "interop"
      - name: Install reference daemons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bird2 frr iproute2
      - name: Build lr-daemon
        run: cargo build -p lr-cli
      - name: Two-daemon interop (librouting ↔ librouting)
        run: ./tests/interop/two_daemon.sh
      - name: OSPF two-daemon interop (raw sockets, user namespace)
        run: ./tests/interop/ospf.sh
      - name: OSPF x BIRD interop (real DBD/LSR exchange, RFC 2328 7.2)
        run: ./tests/interop/ospf_bird.sh
      - name: MRT interop (BIRD dump -> lr parse; daemon Loc-RIB round-trip)
        run: ./tests/interop/mrt.sh
      - name: BMP collector e2e (daemon mirroring -> daemon collector)
        run: ./tests/interop/bmp.sh
      - name: BGP MD5 auth interop (RFC 2385)
        run: ./tests/interop/md5.sh
      - name: BIRD interop (librouting ↔ BIRD)
        run: ./tests/interop/bird.sh
      - name: BIRD IPv6 interop (librouting ↔ BIRD, pure IPv6)
        run: ./tests/interop/bird_ipv6.sh
      - name: BIRD GTSM interop (librouting ↔ BIRD, RFC 5082)
        run: ./tests/interop/bird_gtsm.sh
      - name: BIRD ENH interop (librouting ↔ BIRD, RFC 5549)
        run: ./tests/interop/bird_enh.sh
      - name: BIRD LLGR interop (librouting ↔ BIRD, RFC 9494)
        run: ./tests/interop/bird_llgr.sh
      - name: FRR interop (librouting ↔ FRR bgpd)
        run: ./tests/interop/frr.sh

  # TCP-AO needs Linux >= 6.7: ubuntu-24.04 ships a 6.8 kernel. The
  # script itself skips gracefully when the option is missing, so this
  # job also doubles as a rolling check on newer kernels/packages.
  interop-auth:
    name: Interop auth (TCP-AO, ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "interop-auth"
      - name: Install reference daemons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bird2 frr iproute2
      - name: Build lr-daemon
        run: cargo build -p lr-cli
      - name: TCP-AO two-daemon interop (kernel-gated)
        run: ./tests/interop/tcp_ao.sh
      - name: MD5 auth interop (RFC 2385, incl. BIRD/FRR)
        run: ./tests/interop/md5.sh
