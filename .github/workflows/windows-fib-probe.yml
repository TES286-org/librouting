# Windows FIB probe (manual, on demand) — the wedge-tolerant evidence
# machine for the windows_route_table kernel-gated suite.
#
# WHY THIS SHAPE. The four #[ignore]d tests (the FIB-semantics matrix,
# the ifindex-resolution probe, and the two assertive regressions)
# wedged the every-push CI job on SIXTEEN consecutive runs
# (36125163593 … 36217837148) across every harness shape ever tried:
# plain `timeout N cargo test`, file-stdio children, an in-binary
# kernel-mode TerminateProcess watchdog, timestamped transcripts,
# bash-level taskkill //F //T tree kills, compiling from PowerShell,
# running the test binary directly from bash, console-less
# CREATE_NO_WINDOW grandchildren, and finally a pure-PowerShell step
# with detached launches and bounded WaitForExit budgets — after which
# the pwsh loop provably finished (bounded at 4 x 360 s) and the
# runner STILL could not finalise the step for 37+ minutes. The
# mechanism that fits every observation: a process wedged in an
# UNINTERRUPTIBLE kernel call (netio) is marked for death by
# TerminateProcess but never actually reaped, and the runner's
# step-finalisation waits on it — nothing at the workflow layer can
# fix that. The every-push job therefore no longer runs these tests
# (see ci.yml's windows-interop note); this workflow is where they
# live, structured so that a wedge costs ONE job, never the evidence:
#
# - ONE JOB PER TEST (fail-fast disabled): a wedged test burns only
#   its own job to the 25-minute ceiling; the other three complete
#   and COMMIT THEIR TRANSCRIPTS to the dispatched ref.
# - The commit step runs `if: always()` and pushes with rebase-retry
#   against the sibling jobs' concurrent pushes.
# - Each test launches DETACHED (own hidden console, file stdio) with
#   a bounded WaitForExit budget; the binary's own defenses (kernel-
#   mode self-watchdog exit 70, timestamped PROBE lines) are inside.
#
# The committed transcripts are the deliverable: the last timestamped
# PROBE line of a wedged test names the exact call site that hung —
# the data needed to fix the kernel-level hang itself (tracked in
# issue #29, https://github.com/TES286-org/librouting/issues/29).
#
# Dispatch it on a disposable branch (NOT main — the transcripts are
# committed back to the dispatched ref):
#
#   gh workflow run windows-fib-probe.yml --ref probe/windows-audit
name: Windows FIB probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fib-probe:
    name: "Windows FIB probe (${{ matrix.test }})"
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test:
          - fib_semantics_probe_matrix
          - probe_next_hop_interface_resolution
          - blackhole_route_discards_not_accepts
          - explicit_oif_beats_fib_resolution
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-fib-probe"
      - name: Compile the Windows route-table test binary
        # PowerShell (the default shell) — the only cargo shape that
        # has never wedged on these runners.
        timeout-minutes: 15
        run: cargo test -p lr-osroute --test windows_route_table --no-run
      - name: Run the test (detached, bounded)
        # Pure PowerShell: the test launches DETACHED (own hidden
        # console, stdio to files — nothing the runner waits on is
        # shared with it), and the only wait is WaitForExit(<budget>),
        # bounded even against a kernel-limbo process. An expired
        # budget kills the process; a survivor that refuses to die is
        # abandoned detached. The binary's own TerminateProcess
        # watchdog (exit 70) fires first.
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'target\debug\deps\windows_route_table-*.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Host 'FAIL: no windows_route_table test binary under target\debug\deps\'
            exit 1
          }
          Write-Host "test binary: $($exe.FullName)"
          $t = '${{ matrix.test }}'
          $log = "target\windows-route-table-$t.log"
          $p = Start-Process -FilePath $exe.FullName `
            -ArgumentList @('--ignored', '--nocapture', '--test-threads=1', $t) `
            -WindowStyle Hidden `
            -RedirectStandardOutput $log `
            -RedirectStandardError "$log.err" -PassThru
          if (-not $p.WaitForExit(420000)) {
            $p.Kill()
            Start-Sleep -Seconds 5
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content "$log.err" -ErrorAction SilentlyContinue
            Write-Host "=== $t rc=124 (420s budget exceeded — killed/abandoned detached) ==="
            exit 124
          }
          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content "$log.err" -ErrorAction SilentlyContinue
          Write-Host "=== $t rc=$($p.ExitCode) (0 ok / 70 in-binary watchdog) ==="
          exit $p.ExitCode
      - name: Commit the probe transcript back to the ref
        # ALWAYS runs — the transcript of a wedged/failed test is the
        # deliverable. Sibling matrix jobs push concurrently to the
        # same ref; rebase-retry absorbs the collisions.
        if: ${{ always() && !endsWith(github.ref, '/main') }}
        timeout-minutes: 5
        shell: bash
        run: |
          t='${{ matrix.test }}'
          grep '^PROBE|' "target/windows-route-table-$t.log" > "probe-results-$t.md" 2>/dev/null \
            || echo "no PROBE lines captured (test wedged before first output — or compile failed)" > "probe-results-$t.md"
          {
            echo ""
            echo "## rc marker"
            echo ""
            tail -3 "target/windows-route-table-$t.log" 2>/dev/null || true
          } >> "probe-results-$t.md"
          git config user.name "TES286-bot"
          git config user.email "bot@tes286.top"
          git add "probe-results-$t.md"
          git commit -m "probe: record windows FIB results for $t (run ${{ github.run_id }})" || echo "nothing to commit"
          ref="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$ref" || true
            git rebase "origin/$ref" || { git rebase --abort || true; }
            if git push origin "HEAD:$ref"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "WARN: could not push the transcript after 5 attempts"
          exit 0
