# Windows FIB semantics probe (manual, on demand).
#
# Runs the windows_route_table research matrix as Administrator on a
# real windows-2022 runner — the empirical half of the Windows
# blackhole / egress-interface / row-normalisation investigations. It
# tees every `PROBE|` line into probe-results.md and commits that
# transcript back so the findings are readable without Actions log
# access. The assertive regression tests in the same file may fail on
# an unaudited Windows build; the transcript is the deliverable, so
# the commit step runs with `if: always()`.
#
# Lives OUTSIDE ci.yml because it COMMITS to the dispatched ref: the
# same four tests now run on every push inside the ci.yml
# windows-interop job (assertions + PROBE transcript in the log); this
# workflow remains the on-demand way to get the transcript as a file
# on a disposable branch.
#
# Dispatch it on a disposable branch (NOT main — the transcript is
# committed back to the dispatched ref):
#
#   gh workflow run windows-fib-probe.yml --ref probe/windows-audit
#   # or: curl -X POST .../actions/workflows/windows-fib-probe.yml/dispatches \
#   #        -f ref=probe/windows-audit
#
# The historical watchdog tower (detached payload + 900 s watch loop +
# ceilings raised above the payload's own wall) existed only because a
# wedged test binary could not be reaped and took the transcript down
# with the job. Runs 36125163593-363 progressively isolated the real
# mechanism: MSYS `timeout` cannot kill a native Windows child (its
# SIGTERM is undeliverable to cargo.exe), and — the deeper constant
# across every wedged run — a BASH step spawning cargo is itself the
# hanging shape on these runners, while PowerShell cargo steps never
# fail once. The harness therefore: compiles from PowerShell (the
# proven shape), runs the TEST BINARY DIRECTLY from bash (the proven
# lr-daemon.exe shape — cargo is never spawned from bash), arms a
# kernel-mode self-watchdog in the binary (TerminateProcess, exit 70),
# timestamps every PROBE line so a killed run's transcript names the
# hang site, and bounds each invocation with run_bounded — a
# background run whose expired budget triggers a Windows-native
# taskkill //F //T tree kill — with stdio through files so only the
# bash script ever holds the runner's pipes. The transcripts are
# cat'd back and committed either way.
name: Windows FIB probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fib-probe:
    name: Windows FIB probe (row forms + ifindex resolution)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Git PATH (bash + coreutils)
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-fib-probe"
      - name: Compile the Windows route-table test binary
        # Compiled from the DEFAULT (PowerShell) shell: every wedge
        # this workflow has ever recorded is a bash step spawning
        # cargo, while PowerShell cargo steps never fail. See ci.yml's
        # windows-interop job for the full analysis.
        timeout-minutes: 15
        run: cargo test -p lr-osroute --test windows_route_table --no-run
      - name: Run the FIB probe (Administrator shell)
        # `--test-threads=1`: every test mutates the same FIB rows and
        # reuses the same probe port. The TEST BINARY runs DIRECTLY
        # from bash (the proven lr-daemon.exe shape — cargo is never
        # spawned from bash, the one constant of every historical
        # wedge). Per test: the binary's own watchdog fires at 300 s
        # (rc 70); run_bounded's taskkill //F //T tree kill fires at
        # 360 s (rc 124). Stdio goes through files and is cat'd back
        # into the log and probe-output.log after each invocation.
        timeout-minutes: 30
        shell: bash
        run: |
          run_bounded() {
            budget=$1; log=$2; shift 2
            "$@" >"$log" 2>&1 &
            local pid=$!
            local winpid
            winpid=$(cat "/proc/$pid/winpid" 2>/dev/null \
              || ps -W | awk -v p="$pid" '$1 == p { print $4; exit }')
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$budget" ]; then
                echo "run_bounded: budget of ${budget}s exceeded — killing the process tree (pid=$pid winpid=$winpid)"
                if [ -n "$winpid" ]; then
                  taskkill //F //T //PID "$winpid" >/dev/null 2>&1 || true
                fi
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
          }
          exe=$(ls -t target/debug/deps/windows_route_table-*.exe 2>/dev/null | head -1)
          if [ -z "$exe" ]; then
            echo "FAIL: no windows_route_table test binary under target/debug/deps/"
            exit 1
          fi
          echo "test binary: $exe"
          : > probe-output.log
          rc=0
          for t in fib_semantics_probe_matrix \
                   probe_next_hop_interface_resolution \
                   blackhole_route_discards_not_accepts \
                   explicit_oif_beats_fib_resolution; do
            echo "=== $t (start $(date -u +%H:%M:%S)) ===" | tee -a probe-output.log
            trc=0
            run_bounded 360 "target/windows-route-table-$t.log" \
              "$exe" --ignored --nocapture --test-threads=1 "$t" || trc=$?
            cat "target/windows-route-table-$t.log" | tee -a probe-output.log
            echo "=== $t rc=$trc (0 ok / 70 in-binary watchdog / 124 tree-killed) ===" \
              | tee -a probe-output.log
            if [ "$trc" -ne 0 ]; then rc=$trc; fi
          done
          exit $rc
      - name: Commit the probe transcript back to the ref
        # Guard against dispatching on a protected ref: the step pushes
        # a probe-results.md commit to github.ref_name.
        if: ${{ !endsWith(github.ref, '/main') }}
        timeout-minutes: 5
        shell: bash
        run: |
          grep '^PROBE|' probe-output.log > probe-results.md || echo "no PROBE lines captured" > probe-results.md
          git config user.name "TES286-bot"
          git config user.email "bot@tes286.top"
          git add probe-results.md
          git commit -m "probe: record windows FIB results (run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
