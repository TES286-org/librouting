name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri (UB check for unsafe FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.70 || true
      - name: Miri test
        run: cargo miri test -p lr-ffi --all-features
        continue-on-error: true # nightly + experimental

  # Supply-chain security — ROADMAP-v3 D7.
  #
  # Two independent scanners run every night against the same
  # Cargo.lock CI builds with:
  #
  #   * `cargo audit`  — checks the RustSec advisory database for
  #     any dependency with a known unpatched vulnerability. Pinned
  #     to the latest cargo-audit at install time so the advisory
  #     database is fresh.
  #   * `cargo deny`   — three independent invariants from
  #     `deny.toml` at the repo root: advisories (mirrors
  #     cargo-audit so we get a second parser), licenses (no
  #     unexpected license terms), bans (duplicate versions,
  #     unmaintained crates, foreign-registry sources).
  #
  # Both jobs are required-passing on `main`. A failure here means
  # either a dependency shipped a CVE or someone added a dependency
  # with a license we did not pre-approve in `deny.toml` — review
  # the report, then either bump, replace, or update `deny.toml`.
  supply-chain:
    name: Supply-chain (cargo audit + cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + bin installs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "supply-chain"
      - name: Install cargo-audit
        # `--locked` so a future cargo-audit release does not break
        # CI by depending on a newer Rust feature than the
        # toolchain pin.
        run: cargo install cargo-audit --locked || cargo install cargo-audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked || cargo install cargo-deny
      - name: cargo audit
        # Checks the RustSec advisory database. No `--ignore` here
        # — advisories that need to be ignored are listed in
        # `deny.toml` so cargo-deny stays the single source of
        # truth for ignores.
        run: cargo audit
      - name: cargo deny check
        # All four checks (advisories, licenses, bans, sources) are
        # configured in `deny.toml` at the repo root. `cargo deny`
        # operates on `Cargo.lock`, so it scans every transitive
        # dependency of every workspace member regardless of feature
        # flags. The `--all-features` flag was rejected by cargo-deny
        # 0.20+ — the manifest build is performed by `cargo audit`
        # above, which is the right tool for resolving feature
        # unification before scanning the lock file.
        run: cargo deny check

  # Self-test of the tests/vm harness: boot a minimal initramfs VM with
  # the runner's own kernel (6.8+ has TCP-AO + the MPLS modules) and run
  # the kernel-gated interop scripts (tcp_ao.sh, mpls_lsp.sh, ldp.sh,
  # ospf.sh, bgp_kernel_install.sh, bgp_transit.sh) inside it as root —
  # the same path restricted environments use.
  vm-kernel-gated:
    name: VM harness (kernel-gated interop, QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Install the full kernel module set
        # The runner's linux-azure image ships only linux-modules-*
        # (base); mpls_router / mpls_iptunnel live in
        # linux-modules-extra-$(uname -r). Without them the VM's
        # modprobe fails silently and the MPLS dataplane phases of
        # mpls_lsp.sh + ldp.sh SKIP — which is how the nightly log
        # showed "load mpls_router to exercise it" while claiming
        # success. The initramfs copies the host module tree, so the
        # install must happen BEFORE build_initramfs.sh runs (i.e.
        # before run_vm.sh).
        run: |
          sudo apt-get install -y --no-install-recommends \
            "linux-modules-extra-$(uname -r)" || \
            echo "warn: linux-modules-extra unavailable; MPLS dataplane phases will SKIP" >&2
          ls /lib/modules/$(uname -r)/kernel/net/mpls/ 2>/dev/null || true
      - name: Rebuild the module index
        run: sudo depmod -a "$(uname -r)"
      - name: Run kernel-gated interop in the VM
        env:
          LR_VM_KERNEL: /
          LR_VM_PROFILE: release
          LR_VM_TIMEOUT: 1500
        run: tests/vm/run_vm.sh

  # Fuzzing — ROADMAP-v3 D6.4.
  #
  # Coverage-guided fuzzing of the four highest-risk input
  # surfaces: BGP wire codec, filter DSL parser, ROA validation and
  # BFD keyed-hash auth. Each target runs for 5 minutes against the
  # seed corpus committed under `fuzz/seeds/<target>/`. The job is
  # non-blocking: the crashing input is uploaded as a workflow
  # artifact and no issue is filed; the job does not fail the run — fuzzing is exploratory and a
  # nightly crash from a corner case should not gate the next
  # day's release.
  #
  # Run locally for longer:
  #   cargo +nightly fuzz run bgp_decode -- -max_total_time=3600
  fuzz:
    name: Fuzz (cargo-fuzz, 5 min per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry + cargo-fuzz install
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fuzz-nightly"
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked || cargo +nightly install cargo-fuzz
      - name: Seed corpus from committed seeds
        run: |
          for t in bgp_decode filter_parser roa_validate bfd_auth; do
            mkdir -p "fuzz/corpus/$t"
            cp "fuzz/seeds/$t/"* "fuzz/corpus/$t/" 2>/dev/null || true
          done
      - name: Fuzz bgp_decode (5 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run bgp_decode -- -max_total_time=300 -max_len=4096
      - name: Fuzz filter_parser (5 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run filter_parser -- -max_total_time=300 -max_len=4096
      - name: Fuzz roa_validate (5 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run roa_validate -- -max_total_time=300 -max_len=4096
      - name: Fuzz bfd_auth (5 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run bfd_auth -- -max_total_time=300 -max_len=4096
      - name: Upload crash artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # Benchmark smoke — ROADMAP-v3 D6.2.
  #
  # Runs the four criterion bench harnesses with a reduced sample
  # size so the whole job fits in ~5 minutes. The numbers are
  # written to `target/criterion/` and uploaded as an artifact;
  # a future commit can wire this up to a regression-detection
  # bot that diffs the latest run against the committed baseline.
  #
  # The bench source under `crates/{lr-bgp,lr-policy,lr-rib}/benches/`
  # is the immutable baseline; any code change that regresses a
  # bench by >10% should be visible in the nightly artifact.
  bench-smoke:
    name: Bench smoke (criterion, 5 min total)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-smoke"
      - name: cargo bench (workspace, reduced sample size)
        run: |
          cargo bench --workspace -- \
            --sample-size 10 \
            --warm-up-time 1 \
            --measurement-time 3 \
            --noplot
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-reports
          path: target/criterion/
          if-no-files-found: ignore
          retention-days: 30

  # Public API surface + semver check — ROADMAP "Supply-chain
  # follow-ups".
  #
  # The third gap in the ROADMAP entry is a static-analysis scan of
  # the Rust sources. The two tools that match the project's
  # stability contract (Tier 1: the public Rust API is frozen at
  # 1.0, so any breaking change ships as a new minor) are
  # `cargo public-api` and `cargo semver-checks`:
  #
  #   * `cargo public-api` (cargo-public-api) walks the rustdoc
  #     JSON of every workspace crate and lists or diffs the
  #     public items. The nightly job diffs the current tree
  #     against the latest published tag (`v*`), so any addition
  #     or removal of a public item since the last release is
  #     surfaced in the nightly artifact for triage.
  #   * `cargo semver-checks` (cargo-semver-checks) runs the
  #     `rustdoc-json`-based semver lints against the same baseline
  #     and fails the job if any check finds a violation. This is
  #     the gate the pre-1.0 freeze criteria in
  #     `docs/RELEASE-PLAN.md` §1 already imply: a breaking change
  #     is a minor bump, and `cargo semver-checks` catches the
  #     accidental kind.
  #
  # Both tools use the nightly toolchain for `rustdoc --output-format
  # json`, so this job pulls `nightly` from `rustup`. The
  # toolchain install is the only step that costs time the stable
  # jobs do not.
  api-surface:
    name: API surface (cargo public-api + semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `cargo public-api diff v1.2.0..HEAD` does an in-tree
          # `git checkout` of the baseline tag, so the checkout
          # must carry enough history to reach the latest tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nightly toolchain
        # `cargo public-api` uses `rustdoc --output-format json`,
        # which is still nightly-only. `cargo semver-checks` can
        # use either stable or nightly for rustdoc JSON, but using
        # nightly for both keeps the toolchain story consistent
        # within this job.
        run: rustup toolchain install nightly --profile minimal
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "api-surface"
      - name: Install cargo-public-api and cargo-semver-checks
        # Both tools are `cargo install --locked` so a future
        # release that needs a newer Rust than the toolchain pin
        # fails loudly at install time, not silently on first
        # run. The `|| true` fallback without `--locked` keeps
        # the install working if a transitive lockfile bump slips
        # past the maintainers.
        run: |
          cargo install cargo-public-api --locked || cargo install cargo-public-api
          cargo install cargo-semver-checks --locked || cargo install cargo-semver-checks
      - name: Resolve the latest tag
        # The latest `v*` tag is the semver baseline. The output
        # is shared with both `cargo public-api diff` and
        # `cargo semver-checks --baseline-rev`.
        id: latest-tag
        run: |
          set -euo pipefail
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$TAG" ]; then
            echo "no v* tag found; skipping API diff (first release not yet cut)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: cargo public-api diff (latest tag → HEAD)
        # Per-crate diff against the latest tag. The output is the
        # triage surface: an Added/Changed/Removed breakdown per
        # crate, captured to a single text artifact for review.
        # `--simplified` omits blanket-impls and auto-trait-impls
        # so the diff shows the items the project authored, not
        # the Send/Sync/Unpin noise the compiler emits on every
        # struct.
        #
        # Only library crates are diffable — `cargo public-api`
        # walks `rustdoc --output-format json` of a `[lib]` target,
        # which binary-only crates (e.g. `lr-cli`) lack. The
        # `targets` field on each `cargo metadata` package
        # identifies the lib target by kind `lib` (or `proc-macro`).
        if: steps.latest-tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.latest-tag.outputs.tag }}"
          mkdir -p api-surface
          for crate in $(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); \
              out=[]; \
              [out.append(p['name']) for p in d['packages'] \
                if any(t.get('kind', []) == ['lib'] or 'lib' in t.get('kind', []) \
                       for t in p.get('targets', []))]; \
              print('\n'.join(out))"); do
            echo "=== $crate: $TAG..HEAD ==="
            cargo +nightly public-api -p "$crate" diff "${TAG}..HEAD" \
              --simplified --color=never \
              > "api-surface/${crate}.public-api.diff" 2>&1 || true
            cat "api-surface/${crate}.public-api.diff"
          done
      - name: cargo semver-checks (workspace, baseline = latest tag)
        # The semver gate: every workspace crate is checked against
        # the latest tag's published rustdoc. A failing check means
        # a breaking change slipped past review; the job fails so
        # the finding is triaged before the next release cut.
        # `--all-features` mirrors the build matrix so
        # feature-flagged public items are in scope.
        #
        # The gate became blocking at the v1.3.0 cut, which cleared
        # the pre-existing semver debt the scan first surfaced (a
        # new variant in `lr-bgp::path::AttrType` added between
        # v1.2.0 and v1.3.0). The PR-level variant in
        # `.github/workflows/ci.yml` is the gate that blocks a
        # breaking change at review time; this nightly variant is
        # the rolling snapshot a maintainer diffs against the
        # previous night's run to spot drift that landed through
        # several PRs that individually did not break semver.
        if: steps.latest-tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.latest-tag.outputs.tag }}"
          cargo semver-checks --workspace --all-features \
            --baseline-rev "$TAG"
      - name: Upload API surface diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-surface-diff
          path: api-surface/
          if-no-files-found: ignore
          retention-days: 30

