name: Release

# Release workflow — produces one archive per desktop platform on every
# `v*` tag push, then assembles them into a single GitHub Release
# (draft, with release notes auto-generated from commits). See
# docs/RELEASE-PLAN.md for the semver policy and the freeze criteria
# gating the move from 0.x to 1.0.
#
# Artifacts per platform:
#   - librouting-<os>-<arch>.tar.gz (or .zip on Windows)
#       contains: the platform's liblr_ffi.{so,dll,dylib}, the static
#       liblr_ffi.a (where the toolchain emits one), the public
#       headers (lr_ffi.h, librouting.hpp), and the `lr`, `lr-daemon`
#       and `lrctl` CLI binaries.
#   - lr_ffi.h and librouting.hpp are also attached standalone so a
#     packaging system can pull them without unpacking an archive.

on:
  push:
    tags: ["v*"]

jobs:
  build-native:
    name: Build (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: librouting-linux-x86_64.tar.gz
            lib: liblr_ffi.so
            lr_bin: lr
            lrd_bin: lr-daemon
            lrctl_bin: lrctl
          # macOS Intel: cross-compile from macos-14 (Apple Silicon).
          # GitHub Actions retired the macos-13 (Intel) runner pool
          # during 2025; the universal Apple clang on macos-14 targets
          # both arches natively, so x86_64-apple-darwin builds fine
          # there. See the cross-macos-intel job in ci.yml for the
          # same pattern.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: librouting-macos-x86_64.tar.gz
            lib: liblr_ffi.dylib
            lr_bin: lr
            lrd_bin: lr-daemon
            lrctl_bin: lrctl
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: librouting-macos-aarch64.tar.gz
            lib: liblr_ffi.dylib
            lr_bin: lr
            lrd_bin: lr-daemon
            lrctl_bin: lrctl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: librouting-windows-x86_64.zip
            lib: lr_ffi.dll
            lr_bin: lr.exe
            lrd_bin: lr-daemon.exe
            lrctl_bin: lrctl.exe
          # Linux RISC-V (riscv64gc): native build on real RISC-V hardware
          # via the RISE Project's ubuntu-24.04-riscv runner (issue #65,
          # https://riscv-runners.riseproject.dev/). A native build is
          # preferred over a cross-build for release artifacts because the
          # RISC-V target has no cross-validated release-link path in this
          # repo yet — the riscv-native CI job proves the native build
          # works end-to-end on every push. If the RISE GitHub App is not
          # installed on the repository, this matrix entry fails the
          # release workflow with "no runner found"; install the App
          # (https://github.com/apps/rise-risc-v-runners) before tagging.
          - os: ubuntu-24.04-riscv
            target: riscv64gc-unknown-linux-gnu
            archive: librouting-linux-riscv64gc.tar.gz
            lib: liblr_ffi.so
            lr_bin: lr
            lrd_bin: lr-daemon
            lrctl_bin: lrctl
    runs-on: ${{ matrix.os }}
    # 120 min ceiling: the RISC-V native release build (LTO +
    # codegen-units=1 + opt-level=3) is the slowest entry — RISC-V
    # hardware is roughly 3-5x slower than x86_64 for compute-heavy
    # compilation, and the existing x86_64/macOS/Windows entries
    # finish in ~15-20 min each. 120 min gives the RISC-V entry ~6x
    # slack over the x86_64 baseline; the faster entries are
    # unaffected by a higher ceiling.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
      - name: Build release artifacts
        # The first line builds the whole workspace (lr-ffi shared
        # library + lr-cli's `lr`, `lr-daemon` and `lrctl` binaries).
        # The second line is belt-and-braces: ensures lr-ffi is fresh
        # even if a cache hit skipped the workspace build.
        run: |
          cargo build --workspace --release --all-features --target ${{ matrix.target }}
          cargo build --release -p lr-ffi --target ${{ matrix.target }}
      - name: Stage artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p stage/include
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} stage/ || \
            cp target/release/${{ matrix.lib }} stage/
          # The static archive is not always emitted (e.g. Windows MSVC
          # uses a .lib import library instead); copy when present.
          [ -f target/${{ matrix.target }}/release/liblr_ffi.a ] && \
            cp target/${{ matrix.target }}/release/liblr_ffi.a stage/ || true
          # CLI binaries: `lr` (the inspection CLI — decode, routes,
          # mrt, parity-replay), `lr-daemon` (the reference daemon)
          # and `lrctl` (the operational CLI — status / sessions /
          # routes / reload / shutdown, plus client-side `filter
          # compile`). See docs/lr-cli.md for the full flag reference.
          cp target/${{ matrix.target }}/release/${{ matrix.lr_bin }} stage/
          cp target/${{ matrix.target }}/release/${{ matrix.lrd_bin }} stage/
          cp target/${{ matrix.target }}/release/${{ matrix.lrctl_bin }} stage/
          cp include/lr_ffi.h include/librouting.hpp stage/include/
          tar czf ${{ matrix.archive }} -C stage .
      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir stage, stage\include
          copy "target\${{ matrix.target }}\release\${{ matrix.lib }}" stage\ || copy "target\release\${{ matrix.lib }}" stage\
          if (Test-Path "target\${{ matrix.target }}\release\lr_ffi.dll.lib") {
            copy "target\${{ matrix.target }}\release\lr_ffi.dll.lib" stage\
          }
          copy "target\${{ matrix.target }}\release\${{ matrix.lr_bin }}" stage\
          copy "target\${{ matrix.target }}\release\${{ matrix.lrd_bin }}" stage\
          copy "target\${{ matrix.target }}\release\${{ matrix.lrctl_bin }}" stage\
          copy include\lr_ffi.h stage\include\
          copy include\librouting.hpp stage\include\
          7z a ${{ matrix.archive }} stage
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 7

  # CycloneDX SBOM generation — ROADMAP "Supply-chain follow-ups".
  #
  # One SBOM per top-level binary target the release ships: `lr`,
  # `lr-daemon`, `lrctl` (the three CLI binaries under `lr-cli`) and
  # `lr_ffi` (the C ABI cdylib/staticlib/rlib triple under `lr-ffi`).
  # `cargo cyclonedx --describe binaries` is the right granularity:
  # each binary's dependency closure is distinct, and a consumer
  # embedding via the C ABI or running a CLI binary can pull the
  # SBOM that names exactly the transitive crate set they ship.
  #
  # The output files are renamed to carry the release tag, so a
  # consumer can pair the SBOM with the matching archive without
  # parsing the JSON `metadata.component.version` field.
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + cargo-cyclonedx install
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-sbom"
      - name: Install cargo-cyclonedx
        # `--locked` so a future cargo-cyclonedx release does not
        # break CI by depending on a newer Rust feature than the
        # toolchain pin. The fallback without `--locked` keeps the
        # install working if a transitive lockfile bump slips past
        # the cargo-cyclonedx maintainers.
        run: cargo install cargo-cyclonedx --locked || cargo install cargo-cyclonedx
      - name: Generate SBOM per binary target
        # `--all-features` mirrors the build matrix: every
        # feature-flagged dependency the release binaries ship with
        # is in the SBOM. `--spec-version 1.5` is the latest
        # CycloneDX spec cargo-cyclonedx emits; `--describe
        # binaries` produces one SBOM per `bin`/`cdylib`/`staticlib`
        # target and skips `rlib`-only crates (which are not
        # directly shippable).
        run: |
          cargo cyclonedx \
            --format json \
            --describe binaries \
            --all-features \
            --spec-version 1.5
      - name: Stage and rename SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          TAG="${GITHUB_REF_NAME}"
          cp crates/lr-cli/lr_bin.cdx.json \
            "sbom/librouting-lr-${TAG}.cdx.json"
          cp crates/lr-cli/lr-daemon_bin.cdx.json \
            "sbom/librouting-lr-daemon-${TAG}.cdx.json"
          cp crates/lr-cli/lrctl_bin.cdx.json \
            "sbom/librouting-lrctl-${TAG}.cdx.json"
          cp crates/lr-ffi/lr_ffi_cdylib-staticlib-rlib.cdx.json \
            "sbom/librouting-lr-ffi-${TAG}.cdx.json"
          # A single archive carrying every per-binary SBOM, so a
          # consumer can pull one asset instead of four.
          tar czf "librouting-sbom-${TAG}.tar.gz" -C sbom .
          # Validate every SBOM is well-formed JSON and carries the
          # CycloneDX marker before upload. A malformed file here
          # fails the release early instead of shipping a corrupt
          # SBOM to consumers.
          for f in sbom/*.cdx.json; do
            python3 -c "
          import json, sys
          with open('$f') as fp:
              d = json.load(fp)
          assert d.get('bomFormat') == 'CycloneDX', \
              'bomFormat must be CycloneDX in $f'
          assert 'serialNumber' in d, \
              'missing serialNumber in $f'
          assert 'metadata' in d and 'component' in d['metadata'], \
              'missing metadata.component in $f'
          print('ok: $f', d.get('specVersion'), d['metadata']['component'].get('name'))
          "
          done
          ls -l sbom/ "librouting-sbom-${TAG}.tar.gz"
      - name: Upload SBOM archive
        uses: actions/upload-artifact@v7
        with:
          name: librouting-sbom
          path: |
            librouting-sbom-${{ github.ref_name }}.tar.gz
            sbom/*.cdx.json
          retention-days: 7

  # Cosign keyless signing — ROADMAP "Supply-chain follow-ups".
  #
  # Every release artifact (platform archives, SBOMs, standalone
  # headers) is signed with cosign keyless signing via GitHub
  # Actions OIDC. The signing identity is the workflow's own OIDC
  # token, anchored at the Sigstore Fulcio certificate authority and
  # recorded in the Rekor transparency log. A consumer can verify
  # any artifact against the public Sigstore root without a
  # project-held key.
  #
  # Each artifact gets a single `<name>.bundle` file in DSSE format
  # (cosign 2.x's recommended shape): the bundle carries the
  # signature, the Fulcio certificate and the Rekor transparency
  # log entry, so a consumer needs only the bundle + the artifact
  # + the cosign CLI to verify. No separate .sig / .pem pair to
  # keep in sync.
  sign-artifacts:
    name: Sign artifacts (cosign keyless)
    needs:
      - build-native
      - generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token: write` is required for keyless signing — cosign
      # requests an OIDC token from GitHub Actions and exchanges
      # it for a Fulcio short-lived certificate. Without this
      # permission the sign-blob step fails with "no OIDC token
      # available".
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install cosign
        # `sigstore/cosign-installer@v3` installs the latest stable
        # cosign release; the action itself is pinned to a major
        # version, so a backwards-incompatible cosign-installer
        # change is a dependabot bump, not a silent break. The
        # underlying cosign CLI is allowed to move forward inside
        # the v2 line.
        uses: sigstore/cosign-installer@v3
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: false
      - name: Sign and self-verify artifacts
        # Build the list of files to sign, sign each with a keyless
        # cosign bundle, then immediately verify each signature
        # against the workflow's own OIDC identity. The inline
        # verify catches any signing or transparency-log issue
        # before the bundle is uploaded — a broken bundle never
        # reaches the GitHub Release.
        run: |
          set -euo pipefail
          mkdir -p signatures
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \)
          )
          while IFS= read -r f; do files+=("$f"); done < <(
            find release-assets/librouting-sbom -type f -name '*.cdx.json' 2>/dev/null
          )
          files+=("include/lr_ffi.h" "include/librouting.hpp")
          echo "Will sign ${#files[@]} files"
          for f in "${files[@]}"; do
            name=$(basename "$f")
            echo "=== Signing $name ==="
            cosign sign-blob --yes --bundle "signatures/${name}.bundle" "$f"
            echo "=== Verifying $name ==="
            cosign verify-blob \
              --bundle "signatures/${name}.bundle" \
              --certificate-identity-regexp 'https://github.com/TES286-org/librouting/.github/workflows/release.yml@refs/tags/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
          ls -l signatures/
      - name: Upload signatures
        uses: actions/upload-artifact@v7
        with:
          name: librouting-signatures
          path: signatures/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-native
      - generate-sbom
      - sign-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: false
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p flattened
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} flattened/ \;
          # Per-binary CycloneDX SBOMs and the combined SBOM archive.
          find release-assets/librouting-sbom -type f -name '*.cdx.json' -exec cp {} flattened/ \;
          find release-assets/librouting-sbom -type f -name 'librouting-sbom-*.tar.gz' -exec cp {} flattened/ \;
          # cosign signature bundles (one per archive, SBOM and header).
          find release-assets/librouting-signatures -type f -name '*.bundle' -exec cp {} flattened/ \;
          cp include/lr_ffi.h flattened/
          cp include/librouting.hpp flattened/
          ls -l flattened/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            flattened/*
          draft: true
          generate_release_notes: true
          body: |
            ## librouting ${{ github.ref_name }}

            Pre-built `lr-ffi` shared libraries for Linux (x86_64 and
            RISC-V), macOS (Intel and Apple Silicon) and Windows, the
            public C and C++ headers (`lr_ffi.h`, `librouting.hpp`),
            the `lr`, `lr-daemon` and `lrctl` CLI binaries, a
            CycloneDX SBOM per binary target, and a cosign keyless
            signature bundle per artifact.

            Each platform archive contains:
            - `liblr_ffi.{so,dylib,dll}` — the C ABI shared library
            - `liblr_ffi.a` (where emitted) — the static archive
            - `lr` / `lr-daemon` / `lrctl` (or `.exe` on Windows) — the CLI tools
            - `include/lr_ffi.h` + `include/librouting.hpp` — the headers

            SBOMs (CycloneDX 1.5, JSON, one per binary target):
            - `librouting-lr-${{ github.ref_name }}.cdx.json` — the `lr` inspection CLI
            - `librouting-lr-daemon-${{ github.ref_name }}.cdx.json` — the `lr-daemon` reference daemon
            - `librouting-lrctl-${{ github.ref_name }}.cdx.json` — the `lrctl` operational CLI
            - `librouting-lr-ffi-${{ github.ref_name }}.cdx.json` — the `lr-ffi` C ABI library
            - `librouting-sbom-${{ github.ref_name }}.tar.gz` — every per-binary SBOM in one archive

            Signatures (cosign keyless, one `.bundle` per artifact):
            - `librouting-<file>.bundle` — DSSE bundle (signature +
              Fulcio certificate + Rekor transparency log entry)
            - The bundle lives next to the artifact it signs; pair
              `<artifact>` with `<artifact>.bundle` to verify.

            ### Verifying an artifact

            Verify any artifact against the public Sigstore root
            without a project-held key:

            ```sh
            cosign verify-blob \
              --bundle librouting-<file>.bundle \
              --certificate-identity-regexp 'https://github.com/TES286-org/librouting/.github/workflows/release.yml@refs/tags/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              librouting-<file>
            ```

            The signing identity is the GitHub Actions workflow that
            produced the artifact, anchored at the Sigstore Fulcio
            certificate authority and recorded in the Rekor
            transparency log. See
            [Sigstore's verification guide](https://docs.sigstore.dev/cosign/verify/)
            for the full verification surface.

            See `docs/RELEASE-PLAN.md` for the semver policy, the
            API-freeze criteria, and the post-1.0 governance rules.
            See `docs/lr-cli.md` for the CLI user guide and
            `docs/bindings/{c,cpp,go,python}.md` for the per-language
            embedding guides that ride on top of these artifacts.
